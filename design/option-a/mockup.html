<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larsal · Option A mockup</title>
<link rel="stylesheet" href="vendor/phosphor/regular.css">
<link rel="stylesheet" href="vendor/phosphor/fill.css">
<script src="vendor/simple-icons/brands.js"></script>
<link rel="stylesheet" href="app.css">
<style>
/* ============ Board ============ */
html, body { margin: 0; }
body { font: 400 14px/20px "IBM Plex Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: #dcdfe1; color: #1d1f20; }
body.b-dark { background: #050506; color: #d6d6da; }
.boardbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 16px; padding: 12px 32px; background: rgba(220,223,225,.94); border-bottom: 1px solid rgba(0,0,0,.08); }
body.b-dark .boardbar { background: rgba(5,5,6,.94); border-color: rgba(255,255,255,.08); }
.boardbar h1 { font-size: 15px; font-weight: 600; margin: 0; white-space: nowrap; }
.boardbar .seg { display: inline-flex; padding: 2px; border-radius: 8px; background: rgba(0,0,0,.08); }
body.b-dark .boardbar .seg { background: rgba(255,255,255,.08); }
.boardbar .seg button { height: 28px; padding: 0 12px; border-radius: 6px; font-weight: 500; }
.boardbar .seg button[aria-pressed="true"] { background: #fff; color: #131416; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.boardbar nav { display: flex; gap: 4px; overflow-x: auto; margin-left: auto; }
.boardbar nav a { white-space: nowrap; color: inherit; opacity: .75; text-decoration: none; padding: 4px 8px; border-radius: 6px; font-size: 13px; }
.boardbar nav a:hover { opacity: 1; background: rgba(127,127,127,.15); }
.board { padding: 24px 32px 96px; }
.bsec { margin-top: 48px; }
.bsec > h2 { font-size: 22px; line-height: 28px; font-weight: 600; margin: 0 0 4px; }
.bsec > p { margin: 0 0 24px; opacity: .7; max-width: 760px; }
.frames { display: flex; flex-wrap: wrap; gap: 40px 32px; align-items: flex-start; }
.frame figcaption { margin-top: 12px; font-size: 13px; line-height: 18px; }
.frame figcaption b { font-weight: 600; }
.frame figcaption span { opacity: .65; }
.frame { margin: 0; }
.frame .zoom { zoom: var(--z, 1); }
</style>
</head>
<body>
<header class="boardbar">
  <h1>Larsal · Option A mockup</h1>
  <div class="seg" role="group" aria-label="Theme">
    <button data-board-theme="light" aria-pressed="true">Light</button>
    <button data-board-theme="dark" aria-pressed="false">Dark</button>
  </div>
  <div class="seg" role="group" aria-label="Zoom">
    <button data-board-zoom="fit" aria-pressed="true">Fit</button>
    <button data-board-zoom="1" aria-pressed="false">100%</button>
    <button data-board-zoom="0.6" aria-pressed="false">60%</button>
  </div>
  <nav id="index" aria-label="Sections"></nav>
</header>
<main class="board" id="board"></main>
<script src="mockup.js"></script>
</body>
</html>
