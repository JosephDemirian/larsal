<style>
/* Board: the same look as mockup.html. The frames use only app.css and the parts of mockup.js. */
html, body { margin: 0; }
body { font: 400 14px/20px "IBM Plex Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: #dcdfe1; color: #1d1f20; }
body.b-dark { background: #050506; color: #d6d6da; }
.boardbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 16px; padding: 12px 32px; background: rgba(220,223,225,.94); border-bottom: 1px solid rgba(0,0,0,.08); }
body.b-dark .boardbar { background: rgba(5,5,6,.94); border-color: rgba(255,255,255,.08); }
.boardbar h1 { font-size: 15px; font-weight: 600; margin: 0; white-space: nowrap; }
.boardbar .seg { display: inline-flex; padding: 2px; border-radius: 8px; background: rgba(0,0,0,.08); }
body.b-dark .boardbar .seg { background: rgba(255,255,255,.08); }
.boardbar .seg button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; height: 28px; padding: 0 12px; border-radius: 6px; font-weight: 500; }
.boardbar .seg button[aria-pressed="true"] { background: #fff; color: #131416; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.boardbar nav { display: flex; gap: 4px; overflow-x: auto; margin-left: auto; }
.boardbar nav a { white-space: nowrap; color: inherit; opacity: .75; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; }
.boardbar nav a:hover { opacity: 1; background: rgba(127,127,127,.15); }
.board { padding: 24px 32px 96px; }
.bsec { margin-top: 48px; padding-bottom: 8px; }
.bsec > h2 { font-size: 22px; line-height: 28px; font-weight: 600; margin: 0 0 4px; }
.bsec > p { margin: 0 0 24px; opacity: .75; max-width: 1100px; }
.frames { display: flex; flex-wrap: wrap; gap: 40px 32px; align-items: flex-start; }
.frame { margin: 0; }
.frame figcaption { margin-top: 12px; font-size: 13px; line-height: 18px; max-width: 900px; }
.frame figcaption b { font-weight: 600; }
.frame figcaption span { opacity: .65; }
.frame .zoom { zoom: var(--z, 1); }
/* W-04 wording table */
.wtable { border-collapse: collapse; width: 100%; max-width: 1436px; font-size: 13px; line-height: 18px; background: #fff; border-radius: 10px; overflow: hidden; }
body.b-dark .wtable { background: #131315; }
.wtable th { text-align: left; font-weight: 600; padding: 12px 16px; background: rgba(0,0,0,.04); }
body.b-dark .wtable th { background: rgba(255,255,255,.05); }
.wtable td { padding: 12px 16px; border-top: 1px solid rgba(0,0,0,.08); vertical-align: top; }
body.b-dark .wtable td { border-color: rgba(255,255,255,.08); }
.wtable td:first-child { white-space: nowrap; opacity: .75; }
.wtable th:last-child { width: 220px; } /* room for whole card ids after the wider cell padding */
.wtable .now { color: #8a2a1c; } body.b-dark .wtable .now { color: #ff9b8f; }
.wtable .new { color: #12603b; } body.b-dark .wtable .new { color: #74e4a9; }
#e16-s8 .frame { width: min-content; } /* E16-S8: each frame is as wide as its window, and its caption wraps under it */
</style>

<header class="boardbar">

<script>
'use strict';
/* Proposed additions to the locked Option A mockup (W items in spec/decisions.md), owner's OK pending.
   Built only from mockup.js parts (shell, settingsWin, wizard, generator, dlg, row, grp, sw, stepper, …) and app.css.
   Nothing here changes mockup.html, mockup.js or app.css: a few part functions are swapped for one call and put back. */

const L = (on = false) => `<span style="width:16px"></span>`; // the sort menu's empty check column
const once = (obj, key, fn, run) => { const o = obj[key]; obj[key] = fn(o); try { return run(); } finally { obj[key] = o; } };
const offs = (el, root) => { let x = 0, y = 0; while (el && el !== root) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } return { x, y }; };
const grow = (sel) => (win) => { const b = win.querySelector(sel); const extra = b.scrollHeight - b.clientHeight; if (extra > 0) win.style.height = (win.offsetHeight + extra) + 'px'; };
const toEnd = (sel) => (win) => { const b = win.querySelector(sel); b.scrollTop = b.scrollHeight; };
// Places a .menu under (or, without room, above) the button marked data-anchor, right edges aligned.
const anchor = (win) => {
  const b = win.querySelector('[data-anchor]'), m = win.querySelector('.menu[data-for]'); if (!b || !m) return;
  const p = offs(b, win), below = p.y + b.offsetHeight + 6;
  m.style.left = Math.max(8, p.x + b.offsetWidth - m.offsetWidth) + 'px';
  m.style.top = (below + m.offsetHeight < win.offsetHeight - 8 ? below : p.y - m.offsetHeight - 6) + 'px';
};
const ykLabel = `<span style="display:inline-flex;gap:8px;align-items:center">${brandSvg('yubico', 16)}Security key</span>`;
const KEY_ITEM = 'YubiKey 5 NFC · serial 24531878 · slot 2';
// note: M06-36 shows only after Look for Keys Again (APP-06.8)
const keyMenu = (checked, remove, note) => `<div class="menu" data-for style="width:340px">${`<button class="mi check">${checked ? ic('check') : L()}${KEY_ITEM}</button>`}<div class="msep"></div>
  <button class="mi">${ic('arrows-clockwise')}Look for Keys Again</button>${remove ? `<div class="msep"></div><button class="mi neg">${ic('trash')}Remove Security Key</button>` : ''}
  ${note ? '<p class="help" style="margin:4px 10px 6px">Found 1 security key.</p>' : ''}</div>`;
const numField = (v) => stepper(v).replace('class="step"', 'class="step" style="flex:none"'); // number field beside a slider
const kbdCap = (k) => `<span class="kbd" style="font-size:13px;height:26px;line-height:26px;padding:0 10px">${k}</span>`;

// ---------- W-05 SSH ----------
const sshPage = () => grp('', row('Work with the SSH agent', 'Adds keys from entries to the system agent.', sw(true, 'SSH')))
  + grp('Agent', row('Status', '<span class="mono">/private/tmp/com.apple.launchd.Kp9w/Listeners</span>', `<span class="pill pos">${icf('check-circle')}Connected</span>`)
    + row('Use a different socket', '', sw(false, 'Socket'))
    + row('Security key provider', 'For keys that live on a security key.</span><span class="d">The SSH agent built into macOS has no built-in provider. To use keys that live on a security key, choose a provider library.', selx('Built-in'))
    + row('Larsal\'s agent', '<span class="mono">~/Library/Application Support/Larsal/agent.sock</span>', `<span class="pill pos">${icf('check-circle')}Ready</span><button class="btn sm">Copy Setup Line</button>`));

// ---------- W-06 Auto-Type ----------
const atPage = ({ off = false, ctl = kbdCap('⌃⌥V') + '<button class="btn sm">Change</button>', ctlD = '' } = {}) =>
  (off ? `<div class="notice warn" style="margin:0 0 20px">${ic('warning-circle')}<div><b>Accessibility access is off.</b> Larsal can't type into other apps until you turn it on. <button class="link">Open Privacy & Security</button></div></div>`
    : `<div class="notice neu" style="margin:0 0 20px">${ic('check-circle')}<div><b>Accessibility access is on.</b> macOS lets Larsal type into other apps. <button class="link">Open Privacy & Security</button></div></div>`)
  + grp('Shortcut', row('Type the login for the window in front', ctlD, ctl))
  + grp('Matching', row('Match by window title', '', sw(true, 'Title')) + row('Match by website address in the title', '', sw(true, 'URL')) + row('Always ask which entry to type', '', sw(true, 'Ask'))
    + row('Don\'t ask when I start from Larsal\'s window', '', sw(false, 'Skip ask'), 'sub') + row('Skip expired entries', '', sw(false, 'Expired')) + row('Lock again after typing', '', sw(false, 'Relock')))
  + grp('Timing', row('Wait before typing', '', stepper(500, 'ms')) + row('Pause between keys', '', stepper(25, 'ms')) + row('Preselect the previous choice for', '', stepper(15, 's')));
const atSettings = (o) => settingsWin({ page: 'autotype' }, SETTINGS, { ...SETP, autotype: () => atPage(o) });
const ROW_SEQ = (e, sub, on) => `<button class="rec"${on ? ' style="background:var(--active)"' : ''}>${logo(e)}<span class="who"><b>${esc(e.title)}</b><small>${esc(sub)}</small></span><span class="when">${on ? 'Type login ⏎' : ''}</span></button>`;
function picker({ q = '', body, menu = '' }) {
  return `<div class="desk" style="inset:0"></div><div class="dlg" style="position:absolute;top:40px;left:50%;transform:translateX(-50%);width:560px;padding:16px">
    <div style="display:flex;gap:10px;align-items:center">${ic('keyboard')}<b style="font-weight:600">Type into “Sign in to GitHub · GitHub — Safari”</b></div>
    <div class="help" style="margin:2px 0 12px 26px">Safari</div>
    <label class="search" style="width:100%">${ic('magnifying-glass')}<input value="${esc(q)}" placeholder="Search all entries…"></label>
    <div style="margin-top:8px">${body}</div>
    <div class="help" style="margin-top:8px">↑↓ to choose · ⏎ types the login · ⇧⏎ types the password only</div></div>${menu}`;
}
const BOTP = E({ title: 'GitHub (work bot)', username: 'morgan-labs-ci', brand: 'github' });
const pickRows = ROW_SEQ(byId('github'), 'alex-dev · {USERNAME}{TAB}{PASSWORD}{ENTER} · Personal', true)
  + ROW_SEQ(byId('github'), 'alex-dev · {USERNAME}{TAB}{PASSWORD}{TAB}{TOTP}{ENTER} · Personal', false)
  + ROW_SEQ(BOTP, 'morgan-labs-ci · Work', false);
const rowMenu = `<div class="menu" style="top:150px;left:400px;min-width:252px">${[['user', 'Type Username', '⌘1'], ['password', 'Type Password', '⌘2'], ['clock-countdown', 'Type One-Time Code', '⌘3'], ['link', 'Type URL', '⌘4'], ['keyboard', 'Type with Key Codes', '⌘5'], 0,
  ['copy', 'Copy Username', '⇧⌘1'], ['copy', 'Copy Password', '⇧⌘2'], ['clock-countdown', 'Copy One-Time Code', '⇧⌘3'], ['link', 'Copy URL', '⇧⌘4']]
  .map((m) => m ? `<button class="mi">${ic(m[0])}${m[1]}<span class="k">${m[2]}</span></button>` : '<div class="msep"></div>').join('')}</div>`;
const pickGrid = `<div class="inp" style="margin-bottom:12px"><span class="pw" style="flex:1">${dots(4)}</span></div>
  <div class="icongrid" style="grid-template-columns:repeat(10,1fr)">${Array.from({ length: 20 }, (_, i) => `<button class="num" style="border-color:var(--control);font-size:13px;color:var(--text)" aria-label="Character ${i + 1}">${i + 1}</button>`).join('')}</div>
  <div style="margin-top:12px">${chk(true, 'Add a Tab after each character')}</div>`;

// ---------- W-10 generator ----------
const gPassword = (advanced) => {
  // The sample holds every chosen group (FEA-02.9): upper, lower, digit and symbol.
  let g = generator({ glen: 20 }).replace('<span class="val num">20</span>', numField(20))
    .replace(/<span class="pw">.*?<\/span>(?=<button)/s, `<span class="pw">${pwHtml('M2ciPK%tX7UctF=AQMGf')}</span>`);
  const extra = chk(true, 'Use each chosen type at least once') + `<button class="btn ghost sm" style="margin-top:6px">${ic(advanced ? 'caret-down' : 'caret-right')}Advanced</button>`;
  g = g.replace(/<button class="chkrow" style="margin-top:12px">[\s\S]*?<\/button>/, (m) => m + extra);
  if (!advanced) return g;
  const chips = [['()[]{}', true], [',.:;', true], ['"\'', false], ['-/\\_|', true], ['!*+<=>?', true], ['#$%&@^`~', true]]
    .map(([l, on]) => `<button aria-pressed="${on}" aria-label="Symbols ${esc(l)}">${esc(l)}</button>`).join('');
  const adv = `<div class="sets">${chips}</div>
    <div class="row2"><label>Also use</label><div class="inp" style="flex:1;height:30px"><input class="mono" placeholder="Extra characters"></div></div>
    <div class="row2"><label>Leave out</label><div class="inp" style="flex:1;height:30px"><input class="mono" placeholder="Characters to leave out"></div><button class="btn sm" title="0–9 and A–F only">Hex</button></div>`;
  return g.replace('<button aria-pressed="true" data-a="gset" data-v="symbols">!@#$</button>', '').replace('Advanced</button>', 'Advanced</button>' + adv);
};
const gPhrase = () => generator({ gmode: 'phrase', gwords: 8 }).replace('<span class="val num">8</span>', numField(8))
  .replace('<button>UPPER</button></span></div>', `<button>UPPER</button><button>Mixed</button></span></div>
    <div class="row2"><label>Word list</label>${selx('Built-in · 7,776 words')}${ibtn('plus', 'Add a word list…', '', '', 'sm')}<span style="opacity:.55">${ibtn('minus', 'Remove this word list', '', '', 'sm')}</span></div>`);

// ---------- W-11 editor ----------
const SW = (on) => `<div class="swatches"${on ? '' : ' style="opacity:.55"'}>${['--blue', '--green', '--orange', '--red', '--purple', '--slate'].map((c, i) => `<button style="--c:var(${c})" aria-pressed="${on && i === 0}" aria-label="${c.slice(2)}"></button>`).join('')}</div>`;
const colourSecs = `<section class="edsec"><h3>Colours</h3><p class="lead">Tint this entry in the list.</p><div class="grp"><div class="box">
    ${row('Text colour', 'The title and the username in the list.', SW(true) + sw(true, 'Text colour'))}
    ${row('Row colour', 'The entry\'s row in the list.', SW(false) + sw(false, 'Row colour'))}</div></div></section>
  <section class="edsec"><h3>Reports</h3><div class="grp"><div class="box">
    ${row('Skip in reports', 'Password health and the online breach check leave this entry out.', sw(false, 'Skip in reports'))}</div></div></section>`;

// ---------- W-12 reports ----------
const consent = () => `<div class="notice neu" style="margin:0 0 20px">${ic('shield-check')}<div><b>Check your passwords against known leaks.</b> Larsal sends information to the online Have I Been Pwned service: each password is hashed with SHA-1 and only the first 5 characters of each hash are sent, over HTTPS, so your vault cannot be rebuilt from them. The service learns how many passwords are checked and this Mac's IP address. Nothing is sent until you press the button.</div></div>
  <button class="btn lg primary">${ic('shield-check')}Check passwords online</button>`;
const statsAdd = (orig) => () => {
  const pws = live.filter((e) => e.password), counts = {};
  pws.forEach((e) => { counts[e.password] = (counts[e.password] || 0) + 1; });
  const unique = Object.keys(counts).length, reused = pws.length - unique, most = Math.max(...Object.values(counts));
  const weak = pws.filter((e) => e.password.length < 25 && (bits(e.password) < 75 || isBad(e))).length;
  const short = pws.filter((e) => e.password.length < 8).length, expired = live.filter((e) => e.expires && new Date(e.expires) < NOW).length;
  const tile1 = (label, n, sub, warn) => `<div><span>${label}</span><b class="${warn ? 'bad' : ''}">${n}</b><small>${warn ? ic('warning-circle') + ' ' : ''}${sub}</small></div>`;
  const kp = (cells) => `<div class="kpis num" style="margin-bottom:12px">${cells.join('')}</div>`;
  return kp([tile1('Repeated passwords', reused, `of ${pws.length} passwords`, reused > Math.floor(unique / 10)), tile1('Most uses of one password', most, 'entries', most > 3),
      tile1('Rated below Good', weak, 'Use long random passwords rated Good or Excellent.', weak > 0), tile1('Under 8 characters', short, 'passwords', short > 0)])
    + kp([tile1('Past expiry', expired, 'The vault holds expired entries.', expired > 0), tile1('One-time code entries', live.filter((e) => e.totp).length, 'entries'),
      tile1('Passkey entries', live.filter((e) => e.passkey).length, 'entries'), tile1('Skipped in reports', 0, 'with a password')])
    + `<div style="height:8px"></div>` + orig()
      .replace(/(<span>Average length<\/span><b style="font-weight:500">)[\d.]+ characters/, `$1${Math.round(pws.reduce((a, e) => a + e.password.length, 0) / pws.length)} characters`) // FEA-07.12: whole number
      .replace('<div><span>File</span><b style="font-weight:500">Personal.larsalvault</b></div>', '<div><span>Name</span><b style="font-weight:500">Personal</b></div><div><span>File</span><b style="font-weight:500">Personal.larsalvault</b></div><div><span>Description</span><b style="font-weight:500">Everything that is mine, not work.</b></div>')
      .replace('<div><span>Last saved</span><b style="font-weight:500">Today, 08:50</b></div>', '<div><span>Created on</span><b style="font-weight:500">Mar 3, 2019, 10:00</b></div><div><span>Last saved</span><b style="font-weight:500">Today, 08:50</b></div><div><span>Changes not saved yet</span><b style="font-weight:500">No</b></div>');
};
const passkeysAdd = (orig) => () => orig() + `<div class="inline" style="margin:16px 10px 0">${chk(false, 'Show expired entries')}<button class="btn sm">Import Passkey…</button><button class="btn sm" disabled style="opacity:.55">Export Passkeys…</button></div>`;
const browserEmpty = () => () => '<p style="color:var(--muted);font-size:13px;margin:0 10px">No browser is connected to this vault. Connect one from the Larsal extension.</p>';
const reports = (rep, key, fn) => once(REPS, key, fn, () => shell(M({ mode: 'reports', view: 'health', rep })));

// ---------- W-16, W-17 unlock and recovery ----------
// path: the file being unlocked (UL-PATH); touch: false where Touch ID holds no key for that file (APP-05.29)
const unlockCard = (purpose, path = '~/Documents/Passwords/Personal.larsalvault', touch = true) => `<div class="ucard" style="width:auto"><p style="margin:0 0 16px;font-size:13px;color:var(--muted)">${purpose}</p>${tile('--teal', 'keyhole', 'xl')}<h1>Personal is locked</h1><div class="path" style="overflow-wrap:anywhere">${path}</div>
  <form class="stack" onsubmit="return false">
    <div><label class="lab">Password</label><div class="inp lg">${ic('key')}<input type="password" placeholder="Vault password" autocomplete="off">${ibtn('eye', 'Show password')}</div></div>
    <div class="extra"><div>${ic('file-lock')}<span class="grow">Key file<small>None</small></span><button class="btn sm">Choose…</button></div>
      <div>${brandSvg('yubico', 16)}<span class="grow">Security key<small>Not used</small></span>${sw(false, 'Use a security key')}</div></div>
    <div style="display:flex;gap:8px"><button class="btn xl" style="flex:1">Cancel</button><button class="btn primary xl" style="flex:1">Unlock</button></div>
    ${touch ? `<div class="opts"><button>${ic('fingerprint')}Use Touch ID</button></div>` : ''}</form></div>`;
const RECOVERY = '~/Library/Application Support/Larsal/recovery/3386635e7f523312e706310f8839c32798022491d6048e9342c7329eb0caa0ec.larsalvault'; // SHA-256 of the vault's real path (APP-02.16)

// ---------- W-19 security keys ----------
const credRows = (key) => row('Password', 'Changed Mar 3, 2024', '<button class="btn sm">Change…</button>') + row('Key file', 'personal.larsalkey', '<button class="btn sm">Change…</button><button class="btn sm" style="color:var(--negative)">Remove</button>')
  + row(ykLabel, key ? 'Serial 24531878 · slot 2 · challenge-response' : 'Not used', key ? '<button class="btn sm" data-anchor>Change…</button>' : '<button class="btn sm">Add…</button>');
const forced = (over = '') => `<div style="display:flex;flex-direction:column;height:100%"><div style="height:52px;flex:none;display:flex;align-items:center;padding:0 18px"><div class="lights"><i></i><i></i><i></i></div></div>
  <div style="display:flex;justify-content:center">${dlg('--orange', 'key', 'Change the master key of “Personal”', 'This vault requires a new master key: it was last changed 45 days ago, and it requires a change every 30 days.', '', '<button class="btn lg">Lock</button><button class="btn lg primary">Change Now</button>')}</div></div>${over}`;

// ---------- W-20 icons ----------
const iconPage = (done) => (orig) => (e) => {
  let h = orig(e);
  if (done) h = h.replace('<button class="choice" aria-checked="true"><span class="rb" role="radio" aria-checked="true"></span>', '<button class="choice" aria-checked="false"><span class="rb" role="radio" aria-checked="false"></span>');
  const fetchChoice = `<button class="choice" aria-checked="${done}">${rb(done)}<span style="flex:1"><b>Icon from the website</b><small>${done ? 'Fetched from github.com. The same icon was already in the vault, so Larsal chose it.' : 'Larsal asks github.com for its own icon once and keeps it in the vault.'}</small></span>${done ? logo(e, 'lg') : '<span class="btn sm">Fetch Site Icon</span>'}</button>`;
  return h.replace('</div></section>', fetchChoice + '</div></section>');
};

// ---------- W-15 shared groups ----------
// Demo shares in "Personal": Household (Synchronize; Streaming sits inside it) and Devices, one of the demo vault's own groups (Import, set up on another Mac, waiting for approval).
const HH = { id: 'household', name: 'Household', icon: 'house-line', c: '--purple' };
const HH_KIDS = [{ id: 'streaming', name: 'Streaming', icon: 'film-strip', c: '--red', parent: 'household' }];
const DV = GROUPS.find((g) => g.id === 'devices');
const SH_ENTRIES = [
  E({ id: 'power', title: 'Electricity', icon: 'lightning', c: '--yellow', username: 'family.morgan@posteo.de', password: 'Kv7!mQ2#Ld9@Wx4$', url: 'https://portal.example.com', group: 'household', created: '2025-01-12T10:00', modified: '2026-10-26T19:40', hist: 1 }),
  E({ id: 'alarm', title: 'Alarm system', icon: 'bell', c: '--orange', username: 'morgan-home', password: 'Ha3@rT8!pZ5#nV1$', url: 'https://alarm.example.com', group: 'household', created: '2024-08-03T09:00', modified: '2026-10-24T08:15' }),
  E({ id: 'spotify', title: 'Spotify Family', username: 'family.morgan@posteo.de', password: 'Sp6#Wq1!Xr8@Kt3$', url: 'https://www.spotify.com', group: 'streaming', created: '2023-11-20T20:00', modified: '2026-10-25T21:05' }),
];
const SH_GROUPS = [HH, ...HH_KIDS];
const P15 = 'Shared/Household.larsalvault'; // as stored: relative to the vault's folder (INT-08.5)
const FULL15 = '/Users/alex/Documents/Passwords/Shared/Household.larsalvault';
const DV15 = '/Users/alex/Library/Mobile Documents/com~apple~CloudDocs/Family/Devices.larsalvault'; // ~ is never expanded (INT-08.5), so share paths are drawn whole
function withShares(run) {
  const nf = byId('netflix'), g0 = nf.group;
  GROUPS.push(...SH_GROUPS); ENTRIES.push(...SH_ENTRIES); live.push(...SH_ENTRIES); nf.group = 'streaming';
  try { return run(); } finally { nf.group = g0; live.splice(-SH_ENTRIES.length); ENTRIES.splice(-SH_ENTRIES.length); GROUPS.splice(-SH_GROUPS.length); }

// ---------- E21-S1 QR proposals (not approved) ----------
// Checker patterns have no finder patterns or payload: every drawing is non-scannable.
function e21Grid(n, points, scale, backing) {
  let cells = '';
  for (let y = 4; y < n - 4; y++) for (let x = 4; x < n - 4; x++) {
    if ((x + y) % 2 === 0) cells += `M${x} ${y}h1v1h-1z`;
  }
  return `<svg data-e21-grid="${n}" data-e21-scale="${scale}" data-e21-backing="${backing}" width="${points}" height="${points}" viewBox="0 0 ${n} ${n}" role="img" aria-label="Layout illustration, not a valid QR code" shape-rendering="crispEdges" style="display:block;background:#fff;color:#000"><path fill="#000" d="${cells}"/></svg>`;
}
const e21Actions = (blocked, helpId) => `<button class="btn lg"${blocked ? ' disabled style="opacity:.55"' : ''}>Save Image…</button><button class="btn lg" disabled style="opacity:.55"${blocked ? '' : ` aria-describedby="${helpId}"`}>Share…</button><button class="btn lg primary" style="outline:2px solid var(--accent);outline-offset:2px">Done</button>`;
// Gallery illustrations settle after font layout using layout padding, never a transform or code animation.
const e21Align = (win) => document.fonts.ready.then(() => {
  const svg = win.querySelector('svg[data-e21-grid]'); if (!svg || !win.isConnected) return;
  const d = +svg.dataset.e21Backing, r = svg.getBoundingClientRect();
  svg.parentElement.style.paddingTop = (Math.ceil(r.y * d) / d - r.y) + 'px';
  svg.style.marginLeft = (Math.ceil(r.x * d) / d - r.x) + 'px';
});
function qrProposal(purpose, state = 'value') {
  const dense = state.startsWith('dense'), two = state === 'dense-2x', size = state === 'size', entry = state === 'entry';
  const points = dense ? (two ? 277.5 : 555) : 296;
  const helpId = `e21-share-help-${purpose === 'Wi-Fi join code' ? 'wifi' : state}`;
  const panel = size ? '<p class="help" role="status">Make this window larger to show the QR code.</p>'
    : entry ? '<div style="width:296px;height:296px" aria-label="Reserved code space; code absent during chrome motion"></div>'
    : `<div style="width:${points}px;${two ? 'margin-left:69.5px' : 'margin:auto'}">${e21Grid(dense ? 185 : 37, points, dense ? 3 : 8, two ? 2 : 1)}</div><p class="help" style="margin:12px 0 0;text-align:center">Layout illustration · not a valid QR code</p>`;
  const body = panel + '<p class="help" style="margin:16px 0 0">Anyone who sees this code can read its contents.</p><p class="help" style="margin:4px 0 0">Screenshots and recordings may include this code.</p>'
    + (entry || size ? '' : '<p class="help num" style="margin:12px 0 0">44 seconds until this window closes</p>')
    + (entry || size ? '' : `<p class="help" id="${helpId}" style="margin:12px 0 0">Sharing an image is not available here. You can save the image instead.</p>`);
  let out = dlg('--cyan', 'qr-code', 'Show as QR Code', purpose, body, e21Actions(size || entry, helpId));
  if (state === 'dense-1x') out = out.replace('class="dlg "', 'class="dlg " style="width:599px"');
  return out;
}
const qrExportWarning = (share) => dlg('--orange', 'warning', share ? 'Share a readable QR image?' : 'Save a readable QR image?',

  share ? '<p class="help">The system or browser and the app you choose may keep files or clipboard copies, even if you later cancel. Larsal cannot erase or recall those copies.</p>' : '',
  '<button class="btn lg" style="outline:2px solid var(--accent);outline-offset:2px">Cancel</button>'

    line: 'Adds shared groups: a group of your vault, shared as a file (INT-08; W-15 decided 2026-10-31, LD-262 (6); drawn here by LD-268). The group editor\'s Sharing page with its messages and the line about deleted items, the share badges and the labels under the entry list, the result banner, the approval line with its Approve sheet, and the Shared Groups pages of vault settings and Settings. Unsigned shares only (D-INT08-1 (a)): no signer, certificate or trust parts, so MI08-20 to MI08-22 are not drawn. W-15\'s Settings page replaces the drawn settings-settings-shared-groups, whose identity group is option (b). Serves INT-08.20 to INT-08.26, INT-08.31, INT-08.34, INT-08.39, MI08-01 to MI08-07, MI08-10 to MI08-19 and MI08-23 to MI08-25: every Larsal message of the card except the option (b) ones (the card has no MI08-08 or MI08-09). Built by E11-S5, which never waits for this review (LD-268).',
    frames: [
      { id: 'w-15-sharing-sync', t: 'W-15 Group editor, Sharing page', n: 'INT-08.21: Type Synchronize, Path with Browse… and the full path (INT-08.5), Share password with the generator button (FEA-02), Keep group structure on, Clear; INT-08.23 case 5 in the message slot under Path: MI08-14, as import and export are both off (the defaults, INT-08.7); the deleted-items line (INT-08 security notes, FMT-15.12); inactive badge on the tile (INT-08.24). Only the Sharing page of the group editor is drawn', w: W, h: H, after: grow('.edbody'),
        html: () => editWin('Synchronize', false, note15('neu', 'info', ['Sharing is turned off. Turn on import or export in Larsal\'s settings, Shared groups.'])) },
      { id: 'w-15-sharing-inactive', t: 'W-15 Group editor, Sharing page, not shared yet', n: 'T35: Type Inactive; Path, Browse…, Share password and Keep group structure are off until a type is chosen (INT-08.21); no message while Inactive (INT-08.23); no badge yet; Clear is off only because this group has no share item yet: only Path, Browse…, Share password and Keep group structure follow Type, so an Inactive share that has its item (T42) keeps Clear on', w: W, h: H, after: grow('.edbody'),
        html: () => editWin('Inactive', null, '', false) },
      { id: 'w-15-messages-labels', t: 'W-15 Sharing page messages; share badges and labels', n: 'Left, INT-08.23: cases 1 to 5, first match only, in the slot under Path (MI08-10 to MI08-16), MI08-17 (INT-08.5, INT-08.34) in the same slot, MI08-23 under Share password (INT-08.39); the ‹list› of MI08-10 shows Larsal\'s two names only. Right, INT-08.24: the badge on the share group\'s own tile wherever it shows (sidebar, the detail pane\'s Group field, the group editor\'s title, vault settings, the Approve sheet), never on a subgroup; the label under the entry list when the selected group is a share or inside one (the nearest share counts): MI08-24, then MI08-16, then MI08-15; MI08-25; MI08-18 with Approve (INT-08.31)', card: true,
        html: () => `<div style="display:flex;gap:32px;align-items:flex-start">${msgSheet()}${labelSheet()}</div>` },
      { id: 'w-15-list-banner', t: 'W-15 Shared group after a pass, with the result banner', n: 'INT-08.20: one banner per pass, one line each, warnings before errors; error banner as one line failed; Hide sync success messages on, so no success line; MI08-19 (INT-08.32) and MI08-03 with MI08-07; label MI08-24; import and export allowed, so the badge is active, in the sidebar and on the detail pane\'s Group tile, as Household is the share', w: W, h: H,
        html: () => shareWin({ view: 'household', sel: 'power' }, { hh: true, label: LABEL15.sync(), banner: banner15('', 'warning-circle', [`${mono(P15)}: 2 items were not imported because they belong outside this shared group.`, `${mono(P15)}: export failed. The file could not be written: there is no space left on the disk.`]) }) },
      { id: 'w-15-banner-kinds', t: 'W-15 Banner kinds', n: 'INT-08.20: the banner type is error if any line is an error, else warning, else success; lines start with the path as stored', card: true, html: bannerSheet },
      { id: 'w-15-list-inside-share', t: 'W-15 Inside a shared group, sharing off in Settings', n: 'T41: Streaming sits inside Household and has no badge; the label is Household\'s: MI08-24, then MI08-16 and MI08-15, as import and export are both off (the defaults); Household\'s badge is inactive', w: W, h: H,
        html: () => shareWin({ view: 'streaming', sel: 'netflix' }, { hh: false, label: LABEL15.off() }) },
      { id: 'w-15-list-approval', t: 'W-15 Shared group waiting for approval, Approve sheet', n: 'INT-08.31: settings made on another Mac (or arrived by merge) never import, export or watch until approved; behind the sheet, MI08-18 with the type, the full path and Approve, and the inactive badge; the sheet shows group, type and full path, never cut short; Approve stores the record in Larsal\'s settings (share.approved), Cancel keeps sharing paused. Devices is one of the demo vault\'s own groups; its inactive badge also shows in the sidebar, on the detail pane\'s Group tile and in the sheet', w: W, h: H,
        html: () => shareWin({ view: 'devices', sel: 'wifi' }, { hh: true, label: LABEL15.approve() }) + `<div class="scrim">${approveSheet()}</div>` },
      { id: 'w-15-vault-settings', t: 'W-15 Vault settings, Shared Groups', n: 'INT-08.25, T43, MOD-12.1: read only, one row per share in tree order, the group path without the root joined by “ > ”, type and path as stored; no signer or certificate columns (option (b) only)', w: 900, h: 640,
        html: () => settingsWin({ page: 'share' }, VSET15, { ...VSETP, share: vaultShares }, 'vault') },
      { id: 'w-15-larsal-settings', t: 'W-15 Settings, Shared Groups', n: 'INT-08.26, INT-08.7, T09, T44: Allow import off, Allow export off, Hide sync success messages on (the defaults, D-INT08-10); no signer name, fingerprint or Generate (option (b) only)', w: 900, h: 680,
        html: () => settingsWin({ page: 'share' }, SETTINGS, { ...SETP, share: appShares }) },
    ] },
  { id: 'w-16', title: 'W-16 Recovery copy at the next unlock (proposed)',
    line: 'Adds the question about changes an automatic lock could not save, the unlock sheet for the recovery copy when the vault\'s key changed since, and the notice when no copy could be written. Serves APP-02.16 (MSG-LOCK-RECOVERY, MSG-LOCK-LOST, T53 to T55, T59), APP-06.1, APP-06.27 (LD-217 (2)). Waiting: E5-S10.',
    frames: [
      { id: 'w-16-recovery-question', t: 'W-16 Merge the recovery copy', n: 'Right after the unlock; Merge is the default, Discard deletes the copy', w: W, h: H,
        html: () => shell(M({})) + `<div class="scrim">${dlg('--teal', 'floppy-disk', 'Personal was locked with changes that could not be saved.', 'Merge them into the vault now?', '', '<button class="btn lg danger">Discard</button><button class="btn lg primary">Merge</button>')}</div>` },
      { id: 'w-16-recovery-unlock', t: 'W-16 Unlock the recovery copy', n: 'T59: after Merge, when the key just used fails on the copy; the unlock sheet over the main window (APP-06.1, APP-06.27) with the lock screen\'s whole form; Cancel keeps the copy for the next unlock; no Touch ID, which holds only the vault\'s current key', w: W, h: H,
        html: () => shell(M({})) + `<div class="scrim"><div class="dlg" style="width:430px;padding:23px 25px">${unlockCard('The recovery copy was saved before this vault\'s password or key changed. Unlock it with the ones it had then.', RECOVERY, false)}</div></div>` },
      { id: 'w-16-changes-lost', t: 'W-16 Changes could not be kept', n: 'MSG-LOCK-LOST, with OK', card: true,
        html: () => dlg('--orange', 'warning', 'Changes made to Personal since the last save could not be kept when it was locked.', '', '', '<button class="btn lg primary">OK</button>') },
    ] },
  { id: 'w-17', title: 'W-17 Auto-Type unlock panel (proposed)',
    line: 'Adds the small unlock window Auto-Type opens when the shown vault is locked: the lock screen\'s form with the M06-40 line above it and Cancel left of Unlock. Serves INT-05.25 step 5, APP-06.1, APP-06.27, M06-40. Waiting: E8-S2.',
    frames: [
      { id: 'w-17-unlock-panel', t: 'W-17 Unlock panel for Auto-Type', n: 'Centred on the active screen; Touch ID starts by itself when it is set up', w: 446,
        html: () => `<div class="wiz"><div class="wtop"><div class="lights"><i></i><i></i><i></i></div><b>Unlock Personal</b></div><div class="wmain" style="padding:23px 25px">${unlockCard('Auto-Type needs this vault unlocked.')}</div></div>` },
    ] },
  { id: 'w-19', title: 'W-19 Security keys and the forced key change (proposed)',
    line: 'Adds the key menu behind Add… and Change… (keys and slots with a check on the chosen one, Look for Keys Again with M06-36, Remove Security Key on the credentials page), the wizard row with a chosen key, the serial wording, the credentials row without a key, and the forced key change prompt with its credentials card. Serves APP-07.15 (M07-13), MOD-12.10, APP-06.8, M06-36, MOD-13.8 (F-126, LD-230 (1), LD-232 (4), LD-243 (2)). Waiting: E13-S6 part k.',
    frames: [
      { id: 'w-19-wizard-key-menu', t: 'W-19 New vault step 3, key menu', n: 'Add… pressed; nothing chosen yet; M06-36 after Look for Keys Again', w: 720, h: 720, after: anchor,
        html: () => wizard(2).replace('<button class="btn sm">Add…</button>', '<button class="btn sm" data-anchor>Add…</button>') + keyMenu(false, false, true) },
      { id: 'w-19-wizard-key-chosen', t: 'W-19 New vault step 3, key chosen', n: 'The item\'s words, Change… and Remove', w: 720, h: 720,
        html: () => wizard(2).replace('A YubiKey or OnlyKey with challenge-response.', KEY_ITEM).replace('<button class="btn sm">Add…</button>', '<button class="btn sm">Change…</button><button class="btn sm">Remove</button>') },
      { id: 'w-19-credentials-key-menu', t: 'W-19 Vault settings Security, key menu', n: 'Change… pressed; no M06-36 note until Look for Keys Again (APP-06.8); the row reads the serial the vault stores (LD-243 (2))', w: 900, h: 640, after: anchor,
        html: () => settingsWin({ page: 'security' }, VSET, { ...VSETP, security: () => VSETP.security().replace('YubiKey 5 NFC · slot 2 · challenge-response</span></div><div class="ctl"><button class="btn sm">', 'Serial 24531878 · slot 2 · challenge-response</span></div><div class="ctl"><button class="btn sm" data-anchor>') }, 'vault') + keyMenu(true, true, false) },
      { id: 'w-19-forced-prompt', t: 'W-19 Forced key change', n: 'keychange.msg.forced in Rust\'s words; nothing of the vault is shown', w: W, h: H, html: () => forced() },
      { id: 'w-19-forced-credentials', t: 'W-19 Forced key change, credentials', n: 'After Change Now; Cancel returns to the prompt; the security key row without a key', w: W, h: H,
        html: () => forced(`<div class="scrim">${dlg('--blue', 'lock-key', 'Credentials', 'Change at least one part. The vault opens after Larsal saves the new master key.', grp('', credRows(false)), '<button class="btn lg">Cancel</button>', 'wide')}</div>`) },
    ] },
  { id: 'w-20', title: 'W-20 Site icon download in the editor (proposed)',
    line: 'Adds the editor Icon page\'s download for one entry. A group\'s download is the existing “Fetch Site Icons for Group…” menu item and needs no frame (LD-243 (1)). Serves MOD-06.11, APP-01.21, APP-08 action.download_icon (LD-232 (4)). Waiting: E13-S6 part k parked it; not built until drawn (E13-S1 carries W-20).',
    frames: [
      { id: 'w-20-icon-fetch', t: 'W-20 Editor Icon page with Fetch Site Icon', n: 'Website icon downloads on; with them off (the default) the button is disabled', w: W, h: H,
        html: () => once(EDP, 'icon', iconPage(false), () => shell(M({ mode: 'editor', page: 'icon', edit: 'github' }))) },
      { id: 'w-20-icon-fetched', t: 'W-20 Editor Icon page after the download', n: 'An equal icon was already in the vault; with nothing back the line reads “The site icon could not be fetched.”', w: W, h: H,
        html: () => once(EDP, 'icon', iconPage(true), () => shell(M({ mode: 'editor', page: 'icon', edit: 'github' }))) },
    ] },
  { id: 'e16-s8', title: 'E16-S8 Sync, accounts and sharing (proposed)',
    line: 'Adds sync through Larsal\'s own server, accounts, and sharing through it (LD-262 (2), LD-263; drawn here by LD-268): adding a server with the fingerprint compare, sign-up and the Recovery Kit, account unlock, approving a new Mac with the code compare, the Macs of an account, the sync status line and Sync now with every state, a synced vault\'s Sync page and its kept key-file part, the members page with the list code, the invite sheet with the code compare, family and team roles, removal and the list of passwords a removed member could see with the deleted-for-good line, the shared vault badges, and a shared group (INT-08, E11) beside a shared vault (E18) with their different words (P24). Every message of SYN-01 to SYN-06 and SHR-01 to SHR-04 is drawn in the card\'s words with its id; CRY-04 has no screen words (its two-secret key is behind sign-up). Words without a message id are Larsal\'s own proposals. Demo server on 127.0.0.1 only. Built by E16-S9, E17-S4 and E18-S7, which never wait for this review (LD-268).',
    frames: [
      { id: 'e16-s8-add-server', t: 'E16-S8 Add a server, the fingerprint compare', n: 'SYN-01.2, SYN-01.3, SYN-03.3: Larsal made one TLS handshake and sent no request; MSG-SYNC-FINGERPRINT with the fingerprint as 64 hex digits in 8 groups of 8; They match (the default) pins it, and only then does Larsal send a request (LD-273 (8)); Cancel adds nothing. Behind it, a new Sync page in Settings with no server yet. An invite or a Recovery Kit pins its own fingerprint with no question (SHR-03.9, SYN-06.12)', w: 900, h: 680,
        html: () => settingsWin({ page: 'sync' }, SET8, { ...SETP, sync: syncEmpty }) + `<div class="scrim">${addServerDlg()}</div>` },
      { id: 'e16-s8-account', t: 'E16-S8 Your account on the server', n: 'After They match: a new account (SYN-04.2, SYN-06.1), this Mac added by approval (SYN-06.11) or by Recovery Kit (SYN-06.12); no email (SYN-06.13)', card: true, html: accountDlg },
      { id: 'e16-s8-sign-up', t: 'E16-S8 Sign up', n: 'SYN-06.2: the account password, at least 8 characters, with the strength meter (FEA-05), used exactly as typed and never sent anywhere; it takes the unlock screen\'s path into Rust (APP-06, LD-220); with the account secret it makes the wrap key (SYN-06.3, CRY-04.9); no reset (SYN-06.13). The server names this Mac “Mac”, never its computer name (SYN-04.2)', card: true, html: signUpDlg },
      { id: 'e16-s8-recovery-kit', t: 'E16-S8 Recovery Kit', n: 'MSG-ACCOUNT-KIT with Print, Save as PDF and Done; SYN-06.7: kit format 1, the server address and fingerprint, the account id as 32 hex digits and the account secret as 52 base32 characters in groups of 4; shown once, right after sign-up, and written nowhere else: no log, crash report, state file or general pasteboard (E17-S4)', card: true, html: kitDlg },
      { id: 'e16-s8-account-unlock', t: 'E16-S8 Account unlock on a new Mac', n: 'SYN-06.11 step 6, SYN-06.12: after the code compare or the kit, the new Mac asks for the account password through the unlock screen\'s form (APP-06), opens the account blob on this Mac (SYN-06.3, SYN-06.4) and only then keeps the secrets (SYN-06.8); a wrong password or kit: MSG-ACCOUNT-RESTORE-FAILED (sync and account messages), with no detail on which was wrong', card: true,
        html: () => acctCard({ purpose: 'Larsal needs your account password to finish adding this Mac.', tileH: tile('--cyan', 'user-circle', 'xl'), title: 'Your account', path: S8.srv, touch: false }) },
      { id: 'e16-s8-devices', t: 'E16-S8 Settings, Sync: the server and the Macs of the account', n: 'The device list (SYN-04.8): each Mac by name (Larsal fills in “Mac”, SYN-04.2), when it was added and last seen, to the minute; Remove… revokes one (its sessions go; the last Mac cannot be removed); Add a Mac… (SYN-06.11); Sign Out Everywhere… (SYN-04.9: the other Macs drop the account and keep their vault files); the pinned server and its fingerprint (SYN-03.3); the account id (SYN-06.7)', w: 900, h: 680, after: grow('.sc'),
        html: () => settingsWin({ page: 'sync' }, SET8, { ...SETP, sync: syncPage }) },
      { id: 'e16-s8-add-mac', t: 'E16-S8 Approve a new Mac: the code', n: 'MSG-ACCOUNT-ADD-MAC with Cancel; SYN-06.11 step 1: 16 random bytes as base32 in groups of 4, used once, for 15 minutes; the server gets only its SHA-256 (LD-273 (4)); the sheet also shows the server address and fingerprint', card: true, html: addMacDlg },
      { id: 'e16-s8-new-mac-code', t: 'E16-S8 The new Mac types the code', n: 'SYN-06.11 step 2: after Add a server with its fingerprint compare, and “Add this Mac to your account”; a used code is refused (409), an expired or unknown one too (401)', card: true, html: newMacDlg },
      { id: 'e16-s8-compare-mac', t: 'E16-S8 Approve a new Mac: the code compare', n: 'MSG-CODE-COMPARE on both Macs (SYN-05.5, SYN-06.11 steps 3 to 6): the same 6 digits in two groups of 3; Codes match and Codes differ, neither the default, so Return does nothing (SYN-05 T07); no way past them and no “never ask”; Codes differ, a failed check or 15 minutes end it on both Macs with nothing sealed or registered, and MSG-CODE-FAILED', card: true,
        html: () => s8pair(['On the Mac that approves', cmpDlg('Approve the new Mac')], ['On the new Mac', cmpDlg('Add this Mac to your account')]) },
      { id: 'e16-s8-main-status', t: 'E16-S8 Main window with the sync status line', n: 'SYN-03.13: the status line under “Saved at”, here Synced with the time of the last run that ended well; Sync now starts a run; runs also start after the unlock, 2 s after a save and every 60 s while unlocked, never while locked, saving or editing (SYN-03.4)', w: W, h: H,
        html: () => withStatus(shell(M({})), 'synced') },
      { id: 'e16-s8-status-states', t: 'E16-S8 Status line states', n: 'SYN-03.13 at the sidebar\'s width: Synced, Syncing, Offline, Needs password, Uses a replaced password, Signed out, and Error with the message of the last failure (MSG-SYNC-ERROR); MSG-SYNC-BUSY when the 3rd try ends with 412 (SYN-03.6); MSG-GROUP-WAITING-KEY for a shared vault, and its wording for a vault never opened on this Mac, named “Vault &lt;first 8 hex digits&gt;” (SHR-01 Words)', card: true, html: statusSheet },
      { id: 'e16-s8-vault-sync', t: 'E16-S8 Vault Settings, Sync', n: 'SYN-03.1, SYN-03.4, SYN-03.13, SYN-03.15: the server, the status with Sync now, and Stop syncing, which removes this Mac\'s link only (the key, its key-file part and the server copy stay); a shared vault has no Stop syncing: its way out is Leave (SHR-04.11)', w: 900, h: 640,
        html: () => settingsWin({ page: 'sync' }, VSET8, { ...VSETP, sync: vaultSync }, 'vault') },
      { id: 'e16-s8-linked-unlock', t: 'E16-S8 Unlock a synced vault', n: 'SYN-03.2: the key file row reads “Key part kept for sync”: Larsal takes the part from this Mac\'s device store and asks only for the rest of the key, normally the master password; the same row on the lock screen and in the unlock sheet (APP-06)', card: true, html: linkedUnlock },
      { id: 'e16-s8-kept-for-sync', t: 'E16-S8 Vault Settings, Security of a synced vault', n: 'SYN-03.12 (E16-S9 check): the key file row reads “Kept for sync”, with no Change… or Remove while the vault syncs; Save as key file… writes the part as an XML 2.0 key file (FMT-18.20; no overwrite, mode 0400) that opens the vault with the master password. Drawn for a vault that had no key file (SYN-03.1 step 1)', w: 900, h: 640, after: grow('.sc'),
        html: () => settingsWin({ page: 'security' }, VSET8, { ...VSETP, security: keptSecurity }, 'vault') },
      { id: 'e16-s8-messages-sync', t: 'E16-S8 Sync and account messages', n: 'Every alert of SYN-01, SYN-03, SYN-05 and SYN-06 in the card\'s words, with its buttons in the label; the status-line messages are in the states above. Red error, orange warning, as W-15\'s sheets', card: true, html: syncMsgs },
      { id: 'e16-s8-members', t: 'E16-S8 Members page of a family vault', n: 'Vault Settings › Members, seen by an Organizer: Family, 5 of 6 people (SHR-03.4); each name from the vault (SHR-03.14), and “Member ca0df2c9” with Name… where the vault holds none; Organizer and Member (SHR-03.1), changed by an Organizer for the others, never for itself (SHR-03.3); Remove… (SHR-04.1); Invite… (SHR-03.6); MSG-GROUP-LIST-CODE with the entry number, the 6-digit code and Sync now (SHR-02.13); Leave… (SHR-04.11)', w: 900, h: 640, after: grow('.sc'),
        html: () => famSettings('members', { members: () => membersPage(false) }) },
      { id: 'e16-s8-invite', t: 'E16-S8 Invite sheet', n: 'SHR-03.6: the person\'s name (1 to 64 characters, kept only inside the vault, SHR-03.14) and the role, Member unless the user picks another (SHR-03.1); Organizer is off here: the family has 2 already (SHR-03.4)', card: true, html: inviteDlg },
      { id: 'e16-s8-invite-text', t: 'E16-S8 The invite', n: 'MSG-GROUP-INVITE with Copy and Done; SHR-03.6 step 3: the server\'s origin, its fingerprint and the code as 26 base32 characters in groups of 4; no key and nothing from the vault; once, for 5 days', card: true, html: inviteTextDlg },
      { id: 'e16-s8-compare-invite', t: 'E16-S8 Invite: the code compare', n: 'SHR-03.7 step 6\'s titles over MSG-CODE-COMPARE (SYN-05.5): Codes match and Codes differ, neither the default, no skip; after Codes match on both Macs the newcomer consents, and the inviter signs the add entry and wraps the key (SHR-03.8); otherwise MSG-GROUP-INVITE-FAILED on both', card: true,
        html: () => s8pair(['On your Mac', cmpDlg('Check the code with the person you invited')], ['On Dana\'s Mac', cmpDlg('Check the code with the person who invited you')]) },
      { id: 'e16-s8-roles', t: 'E16-S8 Team roles and rights', n: 'SHR-03.2: Owner, Admin, Member and Read-only, and each member\'s right on this vault: Can view, Can edit, Can manage, or none (“No access”); Owners and Admins manage every vault; Read-only at most views; MSG-GROUP-READ-ONLY on the members page (SHR-03.13); Jo\'s role menu, open with its ticked Read-only over Jo\'s select, so Alex\'s own role and the help line stay clear; nobody changes their own role (SHR-03.3); a team needs a server with team features (E18-S6, MSG-GROUP-NO-TEAMS); its own list code (SHR-02.13)', w: 900, h: 640, after: (win) => { grow('.sc')(win); anchor(win); const b = win.querySelector('[data-anchor]'), m = win.querySelector('.menu[data-for]'); const k = m.querySelector('.mi:has(.ph-check)'); m.style.top = (offs(b, win).y + b.offsetHeight / 2 - offs(k, m).y - k.offsetHeight / 2) + 'px'; },
        html: () => withVault(TEAMV, [], [], () => famHead(settingsWin({ page: 'members' }, VSETF, { ...VSETP, members: teamPage }, 'vault'), TEAMV)) + roleMenu },
      { id: 'e16-s8-remove', t: 'E16-S8 Remove a member', n: 'MSG-GROUP-REMOVE-CONFIRM: Cancel is the default and Remove is red (SHR-04.1); the words say Robin keeps what they saw (SHR-04.9); before it signs, Larsal syncs the vault, or shows MSG-GROUP-REMOVE-WAIT (SHR-04.2)', card: true, html: removeDlg },
      { id: 'e16-s8-removed-list', t: 'E16-S8 Passwords a removed member could see', n: 'MSG-GROUP-REMOVED-LIST on the members page until Close list (SHR-04.6, SHR-04.8): every entry of the vault at removal, the Recycle Bin\'s too, with user name, website and the earlier versions and attachments it had; a tick per row that survives a restart; “Deleted since the removal” for an entry gone since; then MSG-GROUP-DELETED-LINE: the count and the first and last dates of the items deleted for good since Robin joined (SHR-04.7, LD-290 (5)); below, 4 of 6 people and the new entry\'s list code', w: 900, h: 640, after: grow('.sc'),
        html: () => famSettings('members', { members: () => membersPage(true) }) },
      { id: 'e16-s8-shared-unlock', t: 'E16-S8 Unlock a shared vault', n: 'MSG-GROUP-UNLOCK above the unlock form (SHR-01.8, LD-290 (1)): the account password, checked on this Mac against the kept account blob; quick unlock then works as for any vault; the tile carries the server badge', card: true,
        html: () => acctCard({ purpose: 'Enter your account password to open “Morgan family”.', tileH: srvTile(FAMV, false, 'xl', '--surface'), title: 'Morgan family is locked', path: FAMV.path, touch: true }) },
      { id: 'e16-s8-shared-security', t: 'E16-S8 Vault Settings, Security of a shared vault', n: 'SHR-01.15: “Key kept for sharing”, no credential change and no Save as key file; the Encryption settings read only, at SHR-01.2\'s floor (Argon2id, 1 MiB, 1 iteration, 1 lane), with no slider, field or Apply', w: 900, h: 640,

// ---------- E22-S1 file proposals: DRAFT illustrations only ----------
// No encryption, file access, credential generation or operation is performed by these frames.
const e22Button = (text, primary = false, focus = false) => `<button type="button" class="btn lg${primary ? ' primary' : ''}"${focus ? ' style="outline:2px solid var(--accent);outline-offset:2px"' : ''}>${text}</button>`;
const e22Field = (id, label, value, { secret = false, show = false, help = '' } = {}) => `<div><label class="lab" for="${id}">${label}</label><div class="inp"><input id="${id}"${secret ? ' type="password"' : ''} value="${esc(value)}" readonly${secret ? ' autocomplete="off"' : ''}${help ? ` aria-describedby="${id}-help"` : ''}>${show ? ibtn('eye', 'Show passphrase') : ''}</div>${help ? `<p class="help" id="${id}-help" style="margin:6px 0 0">${help}</p>` : ''}</div>`;
const e22Check = (text) => chk(true, text).replace('<button class="chkrow" data-a="cbx">', '<button type="button" class="chkrow" role="checkbox" aria-checked="true">').replace('<span class="cb" role="checkbox" aria-checked="true">', '<span class="cb" aria-checked="true" aria-hidden="true">');
const e22Note = (text) => `<p class="help" style="margin:16px 0 0">${text}</p>`;
const e22File = () => `<div class="panel" style="padding:14px 16px;margin-bottom:18px;display:flex;gap:12px;align-items:center">${tile('--cyan', 'file-image', 'md')}<div><b>Mountain photo.jpg</b><div class="help num">12.4 MB · original stays where it is</div></div></div>`;
const e22Destination = (id, readable = false) => e22Field(id, 'Save as', readable ? 'Mountain photo.jpg' : 'Mountain photo.jpg.age', { help: 'Documents · use a new file name' }) + `<div style="margin-top:12px">${e22Button('Choose Destination…')}</div>`;
const e22Limits = () => e22Note('No server is contacted. Anyone with this encrypted file can test passphrase guesses. Names, sizes and dates may still be visible.');
function e22Dialog(state) {
  const cancel = e22Button('Cancel'), done = e22Button('Done', true, true);
  if (state === 'entry') return dlg('--cyan', 'file-lock', 'Encrypt or decrypt a file', 'Keep a file private, wherever you take it.',
    `<div class="panel" style="padding:24px;text-align:center;border:1px dashed var(--border)">${ic('file-arrow-up')}<h3 style="margin:12px 0 8px">Drop one file here to encrypt it</h3><p class="help">Images and other files · no folders or links</p>${e22Button('Choose File to Encrypt…', true, true)}</div><div style="margin-top:16px">${e22Button('Choose File to Decrypt…')}</div>${e22Note('Also in File ▸ Encrypt File… and Decrypt File…')}`, e22Button('Close'));
  if (state === 'encrypt') return dlg('--cyan', 'file-lock', 'Encrypt File', 'Make an encrypted copy. Your original file stays where it is.',
    e22File()+`<div class="segc" role="group" aria-label="Encryption mode"><button type="button" aria-pressed="true">Passphrase</button><button type="button" aria-pressed="false">Recipients</button></div><div style="margin-top:18px">${e22Field('e22-gen', 'Generated passphrase', 'demo-only', {secret:true,show:true,help:'10 random words · saved as a protected entry before encryption'})}</div><div style="margin-top:12px">${e22Button('Choose My Own Passphrase…')}</div><p class="help">Personal ▸ Files · File passphrase · Mountain photo.jpg</p>${e22Destination('e22-encrypt-destination')}${e22Limits()}`, cancel+e22Button('Encrypt File',true,true),'wide');
  if (state === 'manual') return dlg('--orange', 'key', 'Use your own passphrase', 'Choose a long, unique passphrase. Anyone with the encrypted file can test guesses.',
    `<div class="fgrid">${e22Field('e22-manual-pass', 'Passphrase', 'demo-only',{secret:true})}${e22Field('e22-manual-repeat', 'Repeat passphrase','demo-only',{secret:true})}</div><div class="notice warn" style="margin-top:18px">${ic('warning')}<div>This passphrase may be easy to guess.<br>Losing this passphrase means losing this file.</div></div><div style="margin-top:16px">${e22Check('Save as a protected entry in Personal')}</div>${e22Note('Illustration of the weak-passphrase confirmation. Cancel is the default.')}`,e22Button('Cancel',false,true)+e22Button('Use Anyway'), 'wide');
  if (state === 'recipients') return dlg('--cyan', 'users', 'Encrypt for recipients', 'Check each complete public key with its owner before sending the file.',
    e22File()+e22Field('e22-public-review','Recipient · Morgan','age1zvkyg2lqzraa2lnjvqej32nkuu0ues2s82hzrye869xeexvn73equnujwj',{help:'Demo public key · review the full value, not only the label'})+`<div style="margin-top:12px">${e22Button('Add Recipient…')}${e22Button('Add My File Key…')}</div><div style="margin-top:16px">${e22Check('I checked this key with its owner.')}</div><div style="margin-top:10px">${e22Check('I understand I may not be able to decrypt this file.')}</div>${e22Note('These public keys do not protect against a future quantum computer. This does not prove who sent the file.')}`,cancel+e22Button('Encrypt File',true,true),'wide');
  if (state === 'key') return dlg('--teal','key','Create a file key','Keep the private key protected in your vault. Give only the public key to other people.',
    e22Field('e22-key-title','Entry title','My file key')+`<div style="margin-top:16px">${e22Field('e22-key-vault','Save in','Personal ▸ Files')}</div>${e22Note('The public recipient will be available after your vault saves. The private key is saved as a protected field in your vault.')}`,cancel+e22Button('Create File Key',true,true),'wide');
  if (state === 'decrypt') return dlg('--cyan','lock-open','Decrypt File','Save a readable file from Larsal or another compatible tool.',
    `<div class="panel" style="padding:14px 16px;margin-bottom:18px"><b>Mountain photo.jpg.age</b><div class="help">Native password and X25519 files · binary or armored</div></div><div class="segc" role="group" aria-label="Credential mode"><button type="button" aria-pressed="true">Passphrase</button><button type="button" aria-pressed="false">File Key</button></div><div style="margin-top:16px">${e22Field('e22-decrypt-pass','Passphrase','demo-only',{secret:true})}</div><div style="margin:12px 0 16px">${e22Button('Choose from Vault…')}${e22Button('Choose Key File…')}</div>${e22Destination('e22-decrypt-destination',true)}${e22Note('The saved file is not encrypted. Keep it somewhere private. This does not prove who sent the file.')}`,cancel+e22Button('Save Readable File',true,true),'wide');
  if (state === 'progress') return dlg('--cyan','shield-check','Checking the whole file','Nothing readable is saved until the first whole-file check finishes.',
    `<div role="progressbar" aria-label="Checking the whole file" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62" style="height:8px;border-radius:8px;background:var(--border);overflow:hidden"><div style="width:62%;height:100%;background:var(--accent)"></div></div><p class="help num" role="status">2.48 GB of 4 GB checked · illustration</p><div class="panel" style="padding:14px 16px;margin-top:18px"><div>✓ Preparing encrypted copy</div><div style="margin-top:8px"><b>Checking the whole file</b></div><div class="help" style="margin-top:8px">Next: Saving readable file</div></div>${e22Note('Cancel stops this operation. A passphrase check already running may need to finish before cleanup.')}`,e22Button('Cancel',false,true),'wide');
  if (state === 'complete') return dlg('--teal','check-circle','Readable file saved','Your encrypted source is unchanged.',
    e22Field('e22-completed-path','Saved to','Documents / Mountain photo.jpg')+e22Note('The saved file is not encrypted. It stays on disk after Larsal locks. No other app was opened.'),done,'wide');
  if (state === 'error') return dlg('--orange','warning-circle','This file could not be decrypted','Check the passphrase or file key and try again.',e22Note('No readable file was saved. Supported modes: native password and X25519; binary or armored.'),e22Button('Cancel',false,true)+e22Button('Try Again',true),'wide');
  if (state === 'collision') return dlg('--orange','files','Choose a different name','A file already exists with this name. Choose a different name.',e22Field('e22-collision-path','Existing name','Mountain photo.jpg')+e22Note('The existing file has not been changed. Your source is unchanged.'),e22Button('Cancel',false,true)+e22Button('Choose Another Name…',true),'wide');
  if (state === 'cleanup') return dlg('--orange','warning','Check the destination','Larsal could not remove an incomplete file. It may contain readable data. Check the destination before you leave.',e22Field('e22-cleanup-path','Chosen destination','Documents / Mountain photo.jpg')+e22Note('The source is unchanged. Saved copies and disk backups cannot be recalled or securely erased by Larsal.'),done,'wide');
  return dlg('--teal','lock','Unlock to save a passphrase','The default encrypts with a new passphrase and saves it as a protected entry first.',e22Note('Unlock a writable vault, or explicitly choose your own passphrase or public recipients. No file has been written.'),e22Button('Cancel',false,true)+e22Button('Unlock Vault…',true),'wide');
}

// ---------- board ----------
let PTHEME = new URLSearchParams(location.search).get('theme') === 'dark' ? 'dark' : 'light';
function frameHtml(f, bw) {
  const z = Math.min(1, bw / (f.w || 600));
  const inner = f.html();
  const win = f.card ? `<div class="win cardwin ${PTHEME}" style="overflow:visible;box-shadow:none">${inner}</div>`
    : `<div class="win ${PTHEME}" style="width:${f.w}px;${f.h ? `height:${f.h}px` : ''}">${inner}</div>`;
  return `<figure class="frame" id="${f.id}"><div class="zoom" style="--z:${z}">${win}</div><figcaption><b>${f.t} (proposed)</b>${f.n ? ` <span>· ${f.n}</span>` : ''}</figcaption></figure>`;
}
function table(rows) {
  return `<table class="wtable"><thead><tr><th>Frame</th><th>Current wording</th><th>Proposed wording</th><th>Card</th></tr></thead><tbody>${rows.map(([f, a, b, c]) => `<tr><td>${esc(f)}</td><td class="now">${esc(a)}</td><td class="new">${esc(b)}</td><td>${esc(c)}</td></tr>`).join('')}</tbody></table>`;
}
function renderProposals() {
  document.body.classList.toggle('b-dark', PTHEME === 'dark');
  document.querySelectorAll('[data-p-theme]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.pTheme === PTHEME));
  const board = document.getElementById('proposals'), bw = board.clientWidth - 72;
  board.innerHTML = P.map((s) => `<section class="bsec" id="${s.id}"><h2>${s.title}</h2><p>${s.line}</p>${s.table ? table(s.table) : ''}<div class="frames">${s.frames.map((f) => frameHtml(f, bw)).join('')}</div></section>`).join('');
  document.getElementById('pindex').innerHTML = P.map((s) => `<a href="#${s.id}">${s.id.toUpperCase()}</a>`).join('');
  P.forEach((s) => s.frames.forEach((f) => { if (f.after) f.after(document.querySelector(`#${f.id} .win`)); }));
  tick();
}
document.addEventListener('click', (ev) => { const b = ev.target.closest('[data-p-theme]'); if (b) { PTHEME = b.dataset.pTheme; renderProposals(); } });
window.addEventListener('resize', renderProposals);
renderProposals();
