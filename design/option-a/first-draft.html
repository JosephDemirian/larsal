   table column with one shared countdown in its header.
   Grid at 1440: sheet 1440 - 228 sidebar - 8 inset = 1204; minus 2 x 24 padding = 1156 = 748 table + 24 gap + 384 rail. */
:root {
  --ground: #f3f5f5; --surface: #ffffff; --raised: #f4f6f8; --active: #e9eced;
  --border: #e6e9ea; --rule: #f0f1f2; --control: #cdced1;
  --text: #131416; --muted: #5d5f60;
  --primary: #1d1f20; --accent: #1b6c80; --digit: #1b6c80; --symbol: #a3620a;
  --positive: #1e7b4f; --negative: #c4242a; --warning: #92400e;
  --pill-negative-bg: #ffedea; --pill-negative-ink: #831c1e;
  --pill-warning-bg: #fffbeb; --pill-warning-ink: #92400e;
  --pill-neutral-bg: #ebedee; --pill-neutral-ink: #353736;
  --radius-card: 8px; --radius-control: 6px; --radius-sheet: 16px; --inset: 8px;
  --sidebar: 228px; --topbar: 48px; --gap: 24px; --pad: 24px; --control-h: 32px;
  --font: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 400 14px/20px var(--font); color: var(--text); background: var(--ground); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
.ph, .ph-fill { font-size: 16px; line-height: 1; }

/* Window: one tinted L-frame (sidebar + top bar), white sheet inset 8px right and bottom */
.app { display: grid; grid-template-columns: var(--sidebar) 1fr; grid-template-rows: var(--topbar) 1fr; height: 100vh; }
.top { grid-column: 1 / -1; display: grid; grid-template-columns: var(--sidebar) 1fr auto; align-items: center; padding-right: 16px; }
.lights { display: flex; gap: 8px; padding-left: 16px; align-items: center; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.lights .side-toggle { margin-left: auto; margin-right: 12px; color: var(--muted); width: 28px; height: 28px; display: grid; place-items: center; border-radius: var(--radius-control); }

.search { justify-self: center; width: min(548px, 100%); height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-control); color: var(--muted); }
.search:focus-within { border-color: var(--control); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; color: var(--text); background: none; }
.search input::placeholder { color: var(--muted); }
.kbd { font-size: 12px; color: var(--muted); padding: 0 6px; height: 20px; line-height: 20px; border-radius: 4px; background: var(--raised); white-space: nowrap; }
.top-actions { display: flex; gap: 8px; padding-left: 16px; }
.btn { height: var(--control-h); padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; border-radius: var(--radius-control); border: 1px solid var(--control); background: var(--surface); font-weight: 500; white-space: nowrap; transition: background-color .15s, border-color .15s; }
.btn:hover { background: var(--raised); }
.btn:active { background: var(--active); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: #33363a; }
.btn .kbd { background: var(--active); }

.side { display: flex; flex-direction: column; padding: 4px 8px 16px; min-height: 0; overflow: auto; }
.brand { display: flex; align-items: center; gap: 8px; padding: 4px 10px 14px; font-weight: 600; font-size: 15px; }
.brand .ph-fill { color: var(--accent); font-size: 20px; }
.vault { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: var(--radius-card); }
.vault:hover { background: var(--active); }
.vault b { display: block; font-weight: 500; }
.vault small { display: block; font-size: 12px; line-height: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vault > span { min-width: 0; flex: 1; }
.nav-label { font-size: 12px; color: var(--muted); padding: 22px 10px 6px; }
.nav { list-style: none; margin: 0; padding: 0; }
.nav button { width: 100%; height: 32px; margin-bottom: 2px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: var(--radius-card); color: #3d3f41; text-align: left; }
.nav button .ph { color: var(--muted); }
.nav button:hover { background: #eceeef; }

.nav button[aria-current="page"] .ph { color: var(--text); }
.nav .count { margin-left: auto; font-size: 12px; color: var(--muted); }

.side-foot { margin-top: auto; padding-top: 16px; }

.saved .ph { font-size: 14px; color: var(--positive); }

.sheet { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sheet); margin: 0 var(--inset) var(--inset) 0; padding: 20px var(--pad) 0; display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }

.tabs { display: flex; gap: 24px; margin-top: 20px; border-bottom: 1px solid var(--border); }
.tab { height: 36px; position: relative; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }

.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 384px; gap: var(--gap); }

.table { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 132px 112px 76px; gap: 16px; align-items: center; padding: 0 8px; }
.thead { height: 40px; font-size: 12px; color: var(--muted); }
.thead .r, .row .r { text-align: right; }
.thead .code-h { display: flex; align-items: center; gap: 6px; }

.rows { flex: 1; overflow: auto; padding-bottom: 24px; margin: 0 -8px; padding-left: 8px; padding-right: 8px; }
.row { position: relative; height: 56px; width: 100%; text-align: left; border-radius: var(--radius-card); }
.row + .row::before { content: ""; position: absolute; left: 48px; right: 8px; top: 0; height: 1px; background: var(--rule); }
.row[aria-selected="true"], .row[aria-selected="true"] + .row::before { background: var(--active); }
.row[aria-selected="true"] + .row::before { background: transparent; }

.meter { display: flex; gap: 2px; }
.meter i { width: 14px; height: 3px; border-radius: 2px; background: var(--active); }
.meter i.on { background: #8d9092; }

.health.warn { color: var(--warning); font-weight: 500; }

.empty-rows { padding: 16px 8px; color: var(--muted); border: 1px dashed var(--control); border-radius: var(--radius-card); margin-top: 8px; }

.rail { min-height: 0; overflow: auto; padding-bottom: 24px; }
.rail-head { display: flex; gap: 14px; align-items: center; padding: 4px 0 16px; }

// Password checks, computed from the rows. Common words and years are what make the short ones weak.
const COMMON = /(summer|winter|password|qwerty|admin|sunshine|letmein|morgan|printer|1234|2019|2024)/i;
function bits(pw) {
  if (!pw) return 0;
  const words = pw.trim().split(/\s+/);
  if (words.length >= 4) return Math.round(words.length * 12.9); // passphrase: ~7,776-word list
  let pool = 0;
  if (/[a-z]/.test(pw)) pool += 26; if (/[A-Z]/.test(pw)) pool += 26; if (/\d/.test(pw)) pool += 10; if (/[^a-zA-Z0-9]/.test(pw)) pool += 33;
  const raw = pw.length * Math.log2(pool);
  return Math.round(COMMON.test(pw) ? Math.min(raw, 28) : raw);
}
const live = ENTRIES.filter((e) => e.group !== 'bin');
const reuse = {};
live.forEach((e) => { if (e.password) (reuse[e.password] = reuse[e.password] || []).push(e.id); });
function check(e) {
  if (!e.password) return { level: 'none', word: e.passkey ? 'Passkey only' : '—', seg: 0 };
  const b = bits(e.password);
  const others = (reuse[e.password] || []).filter((id) => id !== e.id);
  if (e.expires && new Date(e.expires) < NOW) return { level: 'warn', word: 'Expired', seg: 2, b, why: `Expired on ${fmtDay(e.expires)}.` };
  if (others.length) return { level: 'bad', word: 'Reused', seg: b < 40 ? 1 : 2, b, why: `Same password as ${others.map((id) => byId(id).title).join(', ')}.` };
  if (b < 40) return { level: 'bad', word: 'Weak', seg: 1, b, why: 'Short and built from a common word.' };
  if (b < 64) return { level: 'ok', word: 'Fair', seg: 3, b };
  return { level: 'ok', word: 'Strong', seg: 4, b };
}
const byId = (id) => ENTRIES.find((e) => e.id === id);
const attention = () => live.filter((e) => ['bad', 'warn'].includes(check(e).level));

// One-time codes: demo values that change every 30 s from a seed (the app uses RFC 6238).
function code(seed, step) { let h = 2166136261; for (const c of seed + ':' + step) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return String((h >>> 0) % 1e6).padStart(6, '0'); }
const fmtCode = (c) => c.slice(0, 3) + ' ' + c.slice(3);

const fmtDay = (s) => new Date(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
function fmtMod(s) {
  const d = new Date(s), days = Math.floor((new Date(NOW.toDateString()) - new Date(d.toDateString())) / 864e5);
  if (days === 0) return 'Today'; if (days === 1) return 'Yesterday'; if (days < 7) return days + ' days';
  return fmtDay(s);
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const host = (u) => { try { return new URL(u).host || u; } catch { return u; } };

function logo(e, lg) {
  const b = e.brand && window.BRANDS[e.brand];
  const inner = b ? `<svg viewBox="0 0 24 24" role="img" aria-label="${esc(b.title)}"><path fill="#${b.hex}" d="${b.path}"/></svg>`
    : e.icon ? `<span class="ph ph-${e.icon}" aria-hidden="true"></span>`
    : `<span class="mono-letter" aria-hidden="true">${esc(e.title[0])}</span>`;
  return `<span class="logo${lg ? ' lg' : ''}">${inner}</span>`;
}
function pwHtml(pw) { return [...pw].map((c) => /\d/.test(c) ? `<span class="d">${c}</span>` : /[a-zA-Z\s]/.test(c) ? esc(c) : `<span class="s">${esc(c)}</span>`).join(''); }

const S = { view: 'all', tab: 'all', q: '', sel: 'github', reveal: false };

function scope() {
  if (S.view === 'bin') return ENTRIES.filter((e) => e.group === 'bin');
  if (S.view === 'all') return live;
  const kids = GROUPS.filter((g) => g.parent === S.view).map((g) => g.id);
  return live.filter((e) => e.group === S.view || kids.includes(e.group));
}
const TABS = [
  ['all', 'All', () => true],
  ['totp', 'Two-step codes', (e) => e.totp],
  ['passkey', 'Passkeys', (e) => e.passkey],
  ['attention', 'Needs attention', (e) => ['bad', 'warn'].includes(check(e).level)],
];
function visible() {
  const f = TABS.find((t) => t[0] === S.tab)[2], q = S.q.toLowerCase();
  return scope().filter(f).filter((e) => !q || (e.title + ' ' + e.username + ' ' + e.url).toLowerCase().includes(q));
}

function renderNav() {
  const item = (id, label, icon, count, cls = '') => `<li><button class="${cls}" data-view="${id}"${S.view === id ? ' aria-current="page"' : ''}><span class="ph ph-${icon}" aria-hidden="true"></span>${label}${count != null ? `<span class="count num">${count}</span>` : ''}</button></li>`;
  navMain.innerHTML = item('all', 'All entries', 'tray', live.length);
  navGroups.innerHTML = GROUPS.map((g) => item(g.id, g.name, g.parent ? 'folder-simple' : g.icon, null, g.parent ? 'sub' : '')).join('');
  navFoot.innerHTML = item('bin', 'Recycle Bin', 'trash') + item('settings', 'Settings', 'gear-six');
}
function renderHead() {
  const g = GROUPS.find((x) => x.id === S.view);
  title.textContent = S.view === 'all' ? 'All entries' : S.view === 'bin' ? 'Recycle Bin' : g.name;
  const n = scope().length, bad = scope().filter((e) => ['bad', 'warn'].includes(check(e).level)).length;
  sub.innerHTML = S.view === 'bin' ? `${n} entries · deleted entries stay here until you empty the bin`
    : `${n} entries${bad ? ` · <b>${bad} need attention</b>` : ''}`;
  tabs.innerHTML = TABS.map(([id, label, f]) => {
    const c = scope().filter(f).length, alert = id === 'attention' && c > 0;
    return `<button class="tab" role="tab" data-tab="${id}" aria-selected="${S.tab === id}">${label}<span class="n num${alert ? ' alert' : ''}">${c}</span></button>`;
  }).join('');
}
function renderRows() {
  const list = visible();
  if (!list.find((e) => e.id === S.sel)) S.sel = list[0] ? list[0].id : null;
  const step = Math.floor(Date.now() / 30000);
  rows.innerHTML = list.map((e) => {
    const c = check(e), segs = [1, 2, 3, 4].map((i) => `<i class="${i <= c.seg ? 'on' : ''}"></i>`).join('');
    const subl = [esc(e.username || host(e.url) || '—')];
    if (e.passkey) subl.push('<span class="ph ph-fingerprint" aria-hidden="true"></span>passkey');
    return `<button class="row cols" role="option" data-id="${e.id}" aria-selected="${S.sel === e.id}" tabindex="-1">
      <span class="who">${logo(e)}<span><b>${esc(e.title)}</b><small>${subl.join(' · ')}</small></span></span>
      <span>${e.totp ? `<span class="code num" data-totp="${e.totp}">${fmtCode(code(e.totp, step))}</span>` : '<span class="dash">—</span>'}</span>
      <span class="health-c">${c.level === 'none' ? `<span class="health">${c.word}</span>` : `<span class="health ${c.level}">${c.word}<span class="meter" aria-hidden="true">${segs}</span></span>`}</span>
      <span class="r mod num mod-c">${fmtMod(e.modified)}</span></button>`;
  }).join('') || `<div class="empty-rows">${S.q ? `No entries match “${esc(S.q)}”.` : 'Nothing here.'}</div>`;
}
function renderRail() {
  const e = S.sel && byId(S.sel);
  if (!e) { rail.innerHTML = ''; return; }
  const c = check(e), g = GROUPS.find((x) => x.id === e.group);
  const step = Math.floor(Date.now() / 30000);
  const copy = (what, label) => `<button class="ibtn" data-copy="${what}" aria-label="Copy ${label}"><span class="ph ph-copy" aria-hidden="true"></span></button>`;
  let h = `<button class="btn back" data-back><span class="ph ph-arrow-left" aria-hidden="true"></span>Entries</button>
    <div class="rail-head">${logo(e, true)}<div style="min-width:0"><h2>${esc(e.title)}</h2>${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(host(e.url))}<span class="ph ph-arrow-square-out" aria-hidden="true" style="font-size:12px"></span></a>` : `<span class="pw-meta">${g ? g.name : 'Personal'}</span>`}</div>
    <div class="tools"><button class="ibtn" aria-label="Edit entry"><span class="ph ph-pencil-simple" aria-hidden="true"></span></button><button class="ibtn" aria-label="More actions"><span class="ph ph-dots-three" aria-hidden="true"></span></button></div></div>`;
  if (c.level === 'bad' || c.level === 'warn') h += `<div class="notice" role="note"><span class="ph ph-warning-circle" aria-hidden="true"></span><div>${c.why} <button>Change password</button></div></div>`;
  h += `<div class="panel">`;
  if (e.username) h += `<div class="field"><div><span class="lbl">${e.id === 'wifi' ? 'Network name' : 'Username'}</span><span class="val">${esc(e.username)}</span></div>${copy('username', 'username')}</div>`;
  if (e.password) h += `<div class="field"><div><span class="lbl">Password</span><span class="val pw">${S.reveal ? pwHtml(e.password) : '•'.repeat(Math.min(e.password.length, 20))}</span>
      <div class="pw-meta${c.level === 'bad' ? ' bad' : ''} num">${c.word} · ${e.password.length} characters · about ${c.b} bits</div></div>
      <button class="ibtn" data-reveal aria-label="${S.reveal ? 'Hide' : 'Show'} password" aria-pressed="${S.reveal}"><span class="ph ph-${S.reveal ? 'eye-slash' : 'eye'}" aria-hidden="true"></span></button>${copy('password', 'password')}</div>`;
  if (e.totp) h += `<div class="field otp"><div><span class="lbl">One-time code</span><span class="big num" data-totp="${e.totp}">${fmtCode(code(e.totp, step))}</span>
      <div class="bar" aria-hidden="true"><i data-bar></i></div><div class="secs num" data-secs></div></div>${copy('code', 'one-time code')}</div>`;
  if (e.passkey) h += `<div class="field"><div><span class="lbl">Passkey</span><span class="val">${esc(e.passkey)} · ${esc(e.username)}</span></div><span class="ph ph-fingerprint" aria-hidden="true" style="color:var(--muted);margin-right:8px"></span></div>`;
  if (e.ssh) h += `<div class="field"><div><span class="lbl">SSH key · ED25519 · in agent</span><span class="val pw" style="font-size:13px">${esc(e.ssh)}</span></div>${copy('ssh', 'key fingerprint')}</div>`;
  h += `</div><div class="panel">`;
  h += `<div class="field"><div><span class="lbl">Group</span><span class="val">${g ? g.name : 'Personal'}</span></div></div>`;
  if (e.tags.length) h += `<div class="field"><div><span class="lbl">Tags</span><div class="chips">${e.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div></div></div>`;
  if (e.files.length) h += `<div class="field"><div><span class="lbl">Attachments</span>${e.files.map((f) => `<div class="file"><span class="ph ph-paperclip" aria-hidden="true"></span>${esc(f.name)} <small class="num">${f.size}</small></div>`).join('')}</div></div>`;
  if (e.notes) h += `<div class="field"><div><span class="lbl">Notes</span><div class="notes">${esc(e.notes)}</div></div></div>`;
  h += `</div><div class="rail-foot num"><span>Modified ${fmtDay(e.modified)}, ${e.modified.slice(11, 16)}</span>${e.hist ? `<button>${e.hist} earlier ${e.hist === 1 ? 'version' : 'versions'}</button>` : '<span>No earlier versions</span>'}</div>`;
  rail.innerHTML = h;
  tick();
}
function render() { renderNav(); renderHead(); renderRows(); renderRail(); }

// Countdown: one shared 30 s window, shown once in the column header and in the open entry.
let lastStep = Math.floor(Date.now() / 30000);
function tick() {
  const now = Date.now(), step = Math.floor(now / 30000), left = 30 - Math.floor((now / 1000) % 30), ratio = ((now / 1000) % 30) / 30;
  if (step !== lastStep) { lastStep = step; document.querySelectorAll('[data-totp]').forEach((n) => n.textContent = fmtCode(code(n.dataset.totp, step))); }
  secsHead.textContent = left + ' s';
  tickHead.style.transform = `scaleX(${1 - ratio})`;
  const bar = rail.querySelector('[data-bar]'), secs = rail.querySelector('[data-secs]');
  if (bar) bar.style.transform = `scaleX(${1 - ratio})`;
  if (secs) secs.textContent = `New code in ${left} s`;
}
setInterval(tick, 250);

let toastT;
function toast(html) { const t = document.getElementById('toast'); t.innerHTML = html; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button'); if (!t) return;
  const app = document.getElementById('app');
  if (t.dataset.view) {
    if (t.dataset.view === 'settings') return toast('<span class="ph ph-gear-six"></span>Settings are not part of this option yet');
    S.view = t.dataset.view; S.tab = 'all'; S.reveal = false; app.classList.remove('nav-open'); render();
  } else if (t.dataset.tab) { S.tab = t.dataset.tab; render(); }
  else if (t.dataset.id) { S.sel = t.dataset.id; S.reveal = false; app.classList.add('detail-open'); renderRows(); renderRail(); }
  else if ('reveal' in t.dataset) { S.reveal = !S.reveal; renderRail(); }
  else if ('back' in t.dataset) app.classList.remove('detail-open');
  else if (t.dataset.copy) {
    const what = { username: 'Username', password: 'Password', code: 'One-time code', ssh: 'Fingerprint' }[t.dataset.copy];
    toast(`<span class="ph ph-check" aria-hidden="true"></span>${what} copied <small>· clipboard clears in 30 s</small>`);
  } else if (t.id === 'sideToggle') app.classList.toggle('nav-open');
  else if (t.id === 'lock') toast('<span class="ph ph-lock-simple" aria-hidden="true"></span>The lock screen is the next screen to design');
});
document.getElementById('q').addEventListener('input', (ev) => { S.q = ev.target.value; renderRows(); renderRail(); });
document.addEventListener('keydown', (ev) => {
  if (ev.metaKey && ev.key.toLowerCase() === 'f') { ev.preventDefault(); document.getElementById('q').focus(); return; }
  if (!['ArrowDown', 'ArrowUp'].includes(ev.key) || ev.target.tagName === 'INPUT') return;
  const list = visible(), i = list.findIndex((e) => e.id === S.sel), n = list[i + (ev.key === 'ArrowDown' ? 1 : -1)];
  if (n) { ev.preventDefault(); S.sel = n.id; S.reveal = false; renderRows(); renderRail(); rows.querySelector(`[data-id="${n.id}"]`).scrollIntoView({ block: 'nearest' }); }
});
console.assert(attention().length === 6, 'needs-attention count');
render();
