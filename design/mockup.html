<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App: clickable mockup</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-sans,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif);color:var(--foreground,#1d1d1f);-webkit-font-smoothing:antialiased}
.still *,.still *::before,.still *::after{animation:none!important;transition:none!important}

/* Page around the mockup */
.page{display:flex;flex-direction:column;gap:14px;padding-bottom:28px}
.mock-bar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.mock-title{font-size:14px;font-weight:600;line-height:1.3}
.mock-sub{font-size:12px;color:var(--muted-foreground,#6b6f76);margin-top:3px}
.mock-controls{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;border:1px solid var(--border,rgba(127,127,127,.32));border-radius:8px;overflow:hidden}
.mbtn{appearance:none;border:0;background:transparent;color:inherit;font:inherit;font-size:12px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.mbtn+.mbtn{border-left:1px solid var(--border,rgba(127,127,127,.32))}
.mbtn:hover{background:rgba(127,127,127,.1)}
.mbtn.on{background:rgba(127,127,127,.2);font-weight:600}
.stage{border-radius:var(--radius,12px);padding:28px;display:flex;justify-content:center;overflow:hidden}
.stage.dark{background:radial-gradient(110% 80% at 15% 0%,#2c3354 0%,#191d2b 50%,#0f1118 100%)}
.stage.light{background:radial-gradient(110% 80% at 15% 0%,#eef1fa 0%,#dde3f1 50%,#ced6ea 100%)}
@media (max-width:900px){.stage{padding:12px}}
.zoomer{flex:none}

/* App window */
.win{position:relative;width:1180px;height:740px;border-radius:12px;overflow:hidden;display:grid;grid-template-columns:232px minmax(0,1fr);background:var(--bg);color:var(--text);box-shadow:var(--shadow);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Cantarell,"Noto Sans",Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.4;text-align:left}
.win.noside{grid-template-columns:minmax(0,1fr)}
:where(.win) button{font:inherit;color:inherit}
.win :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.win input:focus-visible,.win textarea:focus-visible,.win select:focus-visible{outline:0}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.muted{color:var(--text-2)}
.dim{color:var(--text-3)}
.small{font-size:12px}
.sp{flex:1}
.anchor{position:relative}
.inert{pointer-events:none;opacity:.5}
.warn{color:var(--warn)}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lights{display:flex;gap:8px;flex:none}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.win.light .lights i{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}

/* Buttons */
.ibtn{appearance:none;border:0;background:transparent;width:28px;height:28px;border-radius:7px;display:inline-grid;place-items:center;color:var(--text-2);cursor:pointer;flex:none;padding:0}
.ibtn:hover{background:var(--hover);color:var(--text)}
.ibtn svg{width:16px;height:16px}
.ibtn.xs{width:22px;height:22px}
.ibtn.xs svg{width:13px;height:13px}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:transparent;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;flex:none}
.btn:hover{background:var(--hover)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-text)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{background:var(--danger);border-color:transparent;color:#fff}
.btn.ghost{border-color:transparent}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.on{border-color:var(--accent);color:var(--text)}
.btn[disabled]{opacity:.45;pointer-events:none}
.dtext{color:var(--danger)}
.link{appearance:none;border:0;background:transparent;color:var(--link);font-size:13px;cursor:pointer;padding:0;text-decoration:none}
.link:hover{text-decoration:underline}
.kbd{font-size:11px;color:var(--text-3);border:1px solid var(--line-2);border-radius:5px;padding:0 5px;line-height:18px;flex:none}

/* Sidebar */
.side{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:linear-gradient(180deg,var(--side-1),var(--side-2));border-right:1px solid var(--line)}
.side-glow{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.side-glow::after{content:"";position:absolute;left:-60%;right:-20%;bottom:-35%;height:70%;background:radial-gradient(closest-side,var(--glow),transparent)}
.side>*{position:relative}
.side-top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 18px;flex:none}
.dbwrap{padding:0 10px 8px;flex:none}
.dbsw{appearance:none;display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:9px;border:0;background:transparent;cursor:pointer;text-align:left}
.dbsw:hover{background:var(--hover)}
.dbsw .chev{width:15px;height:15px;color:var(--text-3);flex:none}
.dbname{font-size:14px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbtile{--sz:28px;width:var(--sz);height:var(--sz);border-radius:8px;display:inline-grid;place-items:center;font-weight:650;font-size:13px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 72% 62%),hsl(calc(var(--h) + 38) 70% 46%));flex:none;line-height:1}
.dbtile.xs{--sz:16px;border-radius:5px;font-size:9px}
.dbtile.sm{--sz:22px;border-radius:6px;font-size:11px}
.dbtile.xl{--sz:64px;border-radius:18px;font-size:26px}
.side-scroll{flex:1;overflow:auto;min-height:0;padding-bottom:8px}
.nav{padding:0 10px;display:flex;flex-direction:column;gap:1px}
.nav-item{appearance:none;display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;border-radius:7px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left;font-size:13px;color:var(--text)}
.nav-item>svg{width:16px;height:16px;color:var(--text-2);flex:none}
.nav-item:hover{background:var(--hover)}
.nav-item.on{background:var(--active)}
.nav-item .nl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .count{color:var(--text-3);font-size:12px;font-variant-numeric:tabular-nums}
.nav-item.grp{padding-left:4px}
.nav-item.sub{padding-left:24px}
.twisty{width:14px;height:14px;display:inline-grid;place-items:center;color:var(--text-3);flex:none;border-radius:4px}
.twisty svg{width:12px;height:12px;transition:transform .15s}
.twisty.open svg{transform:rotate(90deg)}
.twisty[data-act]:hover{background:var(--hover);color:var(--text)}
.side-sec{display:flex;align-items:center;justify-content:space-between;min-height:28px;padding:14px 10px 4px 20px;color:var(--text-3);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.side-sec .ibtn{width:22px;height:22px}
.side-sec .ibtn svg{width:14px;height:14px}
.sec-btn{appearance:none;display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;padding:0;cursor:pointer;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}
.sec-btn svg{width:12px;height:12px}
.side-bottom{padding:6px 0 12px;flex:none}

/* Main column */
.content{display:grid;grid-template-rows:52px minmax(0,1fr);min-width:0;min-height:0;background:var(--bg)}
.toolbar{display:flex;align-items:center;gap:8px;padding:0 14px 0 16px;border-bottom:1px solid var(--line);min-width:0}
.toolbar .lights{margin-right:6px}
.search{position:relative;flex:1;display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;border-radius:8px;background:var(--field);border:1px solid var(--line);color:var(--text-3);cursor:text;min-width:0}
.search>svg{width:15px;height:15px;flex:none}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:13px;min-width:0;height:100%}
.search input::placeholder{color:var(--text-3)}
.body{display:grid;grid-template-columns:328px minmax(0,1fr);min-height:0;min-width:0}

/* List */
.list{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg-list);border-right:1px solid var(--line)}
.list-head{height:46px;display:flex;align-items:center;gap:8px;padding:0 10px 0 18px;flex:none}
.list-title{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-count{color:var(--text-3);font-size:12px}
.list-scroll{flex:1;overflow:auto;padding:0 8px 12px;min-height:0}
.month{padding:12px 10px 6px;color:var(--text-3);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;cursor:pointer;user-select:none;min-height:52px}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel);color:#fff}
.row-main{min-width:0;flex:1}
.row-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--row-fg,inherit)}
.row-sub{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.sel .row-title{color:#fff}
.row.sel .row-sub{color:rgba(255,255,255,.78)}
.row .flag{width:14px;height:14px;color:var(--warn);flex:none}
.row.sel .flag{color:#fff}
.tile{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;font-size:12px;font-weight:650;flex:none;background:var(--tile-bg);color:var(--tile-fg);line-height:1}
.tile svg{width:16px;height:16px}
.tile.xs{width:20px;height:20px;border-radius:6px;font-size:9px}
.tile.xs svg{width:11px;height:11px}
.tile.md{width:40px;height:40px;border-radius:10px;font-size:14px}
.tile.md svg{width:20px;height:20px}
.tile.lg{width:64px;height:64px;border-radius:16px;font-size:22px}
.tile.lg svg{width:30px;height:30px}
.row.sel .tile{box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.empty{padding:40px 24px;text-align:center;color:var(--text-2);font-size:13px}
.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:4px;font-weight:600}
.empty .btn{margin-top:14px}
.empty.small{padding:14px 4px;text-align:left}

/* Detail */
.detail{display:flex;flex-direction:column;min-height:0;min-width:0}
.detail-head{height:46px;display:flex;align-items:center;gap:8px;padding:0 12px 0 22px;flex:none}
.crumb{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:13px;min-width:0;flex:1;white-space:nowrap;overflow:hidden}
.crumb>svg{width:13px;height:13px;color:var(--text-3);flex:none}
.detail-scroll{flex:1;overflow:auto;padding:6px 32px 40px;min-height:0}
.hero{display:flex;align-items:center;gap:18px;padding:12px 0 22px}
.hero-title{font-size:24px;font-weight:650;letter-spacing:-.01em;line-height:1.2;word-break:break-word}
.hero-sub{font-size:12px;color:var(--text-2);margin-top:5px;display:flex;gap:6px;align-items:center}
.hero-sub svg{width:13px;height:13px}
.card{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:14px}
.f{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;min-height:58px}
.f+.f{border-top:1px solid var(--line)}
.card>.f:first-child{border-radius:10px 10px 0 0}
.card>.f:last-child{border-radius:0 0 10px 10px}
.card>.f:only-child{border-radius:10px}
.f:hover{background:var(--hover)}
.f-lead{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--field);color:var(--text-2);flex:none}
.f-lead svg{width:16px;height:16px}
.f-main{flex:1;min-width:0}
.f-label{font-size:12px;color:var(--label);font-weight:500}
.f-val{font-size:14px;color:var(--text);margin-top:2px;word-break:break-word}
.f-val.pw{letter-spacing:.04em;word-break:break-all}
.f-val a{color:var(--link);text-decoration:none}
.f-val a:hover{text-decoration:underline}
.f-note{font-size:12px;color:var(--text-2);margin-top:2px}
.f-tools{display:flex;align-items:center;gap:2px;opacity:0;transition:opacity .12s;flex:none}
.f:hover .f-tools,.f-tools.show{opacity:1}
.f-icon{color:var(--text-2);display:grid;place-items:center;width:28px;height:28px}
.f-icon svg{width:18px;height:18px}
.pw .d{color:var(--pw-digit)}
.pw .s{color:var(--pw-symbol)}
.note{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.5}
.warnline{display:flex;align-items:center;gap:6px;color:var(--warn);font-size:12px;margin-top:4px}
.warnline svg{width:13px;height:13px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{appearance:none;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--line-2);color:var(--text-2);font-size:12px;cursor:pointer;background:transparent}
.chip:hover{color:var(--text);border-color:var(--text-3)}
.chip.static{cursor:default;padding-right:2px}
.chip-x{appearance:none;border:0;background:transparent;width:16px;height:16px;border-radius:4px;display:grid;place-items:center;cursor:pointer;color:var(--text-3);padding:0}
.chip-x:hover{background:var(--hover);color:var(--text)}
.chip-x svg{width:11px;height:11px}
.totp{display:flex;align-items:center;gap:10px}
.totp-code{font-size:17px;font-weight:600;letter-spacing:.08em}
.ring{width:20px;height:20px;transform:rotate(-90deg);flex:none}
.ring .bg{stroke:var(--line-2)}
.ring .fg{stroke:var(--accent);transition:stroke-dashoffset .9s linear}
.ring.low .fg{stroke:var(--warn)}
.totp-sec{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;width:26px}
.foot{appearance:none;display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:13px;padding:6px 2px;cursor:pointer;border:0;background:transparent}
.foot svg{width:14px;height:14px;transition:transform .15s}
.foot.open svg{transform:rotate(90deg)}
.foot:hover{color:var(--text)}
.meta{display:grid;grid-template-columns:110px 1fr;gap:7px 16px;padding:8px 2px 4px 22px;font-size:12px;color:var(--text-2)}
.meta b{font-weight:500;color:var(--text-3)}

/* Menus and popovers */
.menu{position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:224px;padding:5px;border-radius:10px;background:var(--raise);border:1px solid var(--line-2);box-shadow:0 14px 36px rgba(0,0,0,.32)}
.menu.right{left:auto;right:0}
.db-menu{left:10px;right:10px;min-width:0}
.mi{appearance:none;display:flex;align-items:center;gap:10px;width:100%;height:28px;padding:0 10px;border:0;background:transparent;border-radius:6px;font-size:13px;text-align:left;cursor:pointer;color:var(--text);white-space:nowrap}
.mi>svg{width:15px;height:15px;color:var(--text-2);flex:none}
.mi>span:not(.mk):not(.check):not(.dbtile){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mi .mk{margin-left:auto;color:var(--text-3);font-size:12px;display:inline-flex;gap:4px;align-items:center}
.mi .mk svg{width:13px;height:13px}
.mi .check{width:15px;display:inline-grid;place-items:center;color:var(--accent);flex:none}
.mi .check svg{width:14px;height:14px}
.mi:hover{background:var(--accent);color:#fff}
.mi:hover>svg,.mi:hover .mk,.mi:hover .check{color:#fff}
.mi.danger{color:var(--danger)}
.mi.danger:hover{background:var(--danger);color:#fff}
.msep{height:1px;background:var(--line);margin:5px 6px}
.mhead{padding:6px 10px 4px;font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase}
.search-help{left:-1px;right:auto;width:340px}
.search-help .mi .mono{flex:none!important;width:96px}

/* Generator */
.gen{position:absolute;z-index:40;top:calc(100% + 6px);right:0;width:350px;padding:14px;border-radius:12px;background:var(--raise);border:1px solid var(--line-2);box-shadow:0 18px 48px rgba(0,0,0,.35);cursor:default}
.gen-out{display:flex;align-items:center;gap:4px;padding:8px 4px 8px 12px;border-radius:9px;background:var(--field);border:1px solid var(--line);margin:12px 0 8px}
.gen-out .v{flex:1;min-width:0;font-size:14px;word-break:break-all;line-height:1.45}
.gen-row{display:flex;align-items:center;font-size:13px;margin:14px 0 6px}
.range{width:100%;accent-color:var(--accent);margin:0}
.optchips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.opt{appearance:none;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);background:transparent;cursor:pointer;font-size:12px;color:var(--text-2)}
.opt.on{border-color:var(--accent);color:var(--text);background:var(--ring)}
.gen-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;font-size:12px;color:var(--text-2)}
.gen-grid .inp{margin-top:6px}
.gen-grid .optchips{margin:6px 0 0}
.gen-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.gen .check-row{padding:9px 0}

/* Meters, toggles, radios */
.meter{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--text-2)}
.meter-bar{flex:1;height:4px;border-radius:2px;background:var(--line-2);overflow:hidden}
.meter-bar i{display:block;height:100%;border-radius:2px}
.toggle{appearance:none;position:relative;width:34px;height:20px;border-radius:10px;background:var(--line-2);border:0;cursor:pointer;flex:none;transition:background .15s;padding:0}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(14px)}
.check-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0}
.check-row+.check-row{border-top:1px solid var(--line)}
.check-row .t{font-size:13px}
.check-row .s{font-size:12px;color:var(--text-2);margin-top:2px}
.radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--text-3);display:inline-grid;place-items:center;flex:none}
.radio.on{border-color:var(--accent)}
.radio.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.radio-row{appearance:none;display:flex;align-items:flex-start;gap:10px;width:100%;padding:10px 0;border:0;background:transparent;cursor:pointer;text-align:left;font-size:13px}
.radio-row .radio{margin-top:1px}
.radio-row.inline{width:auto;padding:6px 0;align-items:center}
.off{opacity:.45;pointer-events:none}

/* Editor */
.editor,.reports{grid-column:1 / -1;display:grid;min-height:0;min-width:0}
.editor{grid-template-rows:60px minmax(0,1fr)}
.ed-head{display:flex;align-items:center;gap:12px;padding:0 16px 0 22px;border-bottom:1px solid var(--line);min-width:0}
.ed-kicker{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-ht{min-width:0}
.ed-main{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:0}
.ed-nav{padding:12px 10px;border-right:1px solid var(--line);background:var(--bg-list);display:flex;flex-direction:column;gap:1px;overflow:auto}
.ed-page{overflow:auto;padding:22px 32px 48px;min-height:0}
.ed-page h3{margin:22px 0 4px;font-size:15px;font-weight:600}
.ed-page h3:first-child{margin-top:0}
.lead{margin:0 0 12px;color:var(--text-2);font-size:13px}
.fieldset{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:4px 16px;margin-bottom:14px}
.fieldset.tight{padding:8px 12px}
.fr{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:center;padding:10px 0}
.fr.top{align-items:start}
.fr.top>label{padding-top:8px}
.fr+.fr{border-top:1px solid var(--line)}
.fr>label{font-size:13px;color:var(--text-2)}
.frc{min-width:0}
.inp{display:flex;align-items:center;gap:2px;height:34px;padding:0 3px 0 10px;border-radius:8px;background:var(--field);border:1px solid var(--line);min-width:0}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.inp input,.inp select{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:13px;height:100%}
.inp select{cursor:pointer}
.inp.mono input{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.inp.lg{height:42px;padding-left:12px}
.inp.lg input{font-size:14px}
.inp.bad{border-color:var(--danger)}
.inp.narrow{width:160px;flex:none}
.inp.grow{flex:1}
.inp .lead-ic{width:16px;height:16px;color:var(--text-3);margin-right:6px;flex:none}
.inp.tags{height:auto;min-height:34px;flex-wrap:wrap;gap:6px;padding:5px 6px 5px 8px}
.inp.tags input{height:22px;min-width:80px}
textarea.ta{display:block;width:100%;min-height:110px;resize:vertical;border-radius:8px;background:var(--field);border:1px solid var(--line);color:var(--text);font:inherit;font-size:13px;line-height:1.5;padding:8px 10px;outline:0}
textarea.ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.attr{display:grid;grid-template-columns:170px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0}
.assoc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0}
.assoc.head{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;padding:4px 2px}
.urlrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0}
.filerow{display:flex;align-items:center;gap:10px;padding:8px 2px;font-size:13px}
.filerow>svg{width:16px;height:16px;color:var(--text-2)}
.filerow+.filerow{border-top:1px solid var(--line)}
.row-actions{display:flex;gap:8px;padding:8px 0 4px}
.swatches{display:flex;gap:6px;align-items:center}
.sw-btn{appearance:none;width:22px;height:22px;border-radius:6px;border:1px solid var(--line-2);cursor:pointer;padding:0;display:grid;place-items:center}
.sw-btn.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.sw-btn svg{width:12px;height:12px;color:var(--text-3)}
.icon-opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.icon-opt{appearance:none;display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;font-size:13px}
.icon-opt.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.icon-opt b{font-weight:600;display:block}
.icon-opt .muted{font-size:12px}
.std-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;padding:8px 0}
.std{appearance:none;aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--field);display:grid;place-items:center;cursor:pointer;color:var(--text-2);padding:0}
.std svg{width:18px;height:18px}
.std:hover{color:var(--text);border-color:var(--line-2)}
.std.on{border-color:var(--accent);color:var(--text);box-shadow:0 0 0 3px var(--ring)}

/* Tables and reports */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--hover)}
.tbl td.tr{text-align:right;white-space:nowrap}
.tbl td svg.dim{width:14px;height:14px;vertical-align:middle}
.cell-t{display:flex;align-items:center;gap:8px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;border:1px solid currentColor;font-size:12px;font-weight:500;white-space:nowrap}
.reports{grid-template-rows:auto minmax(0,1fr)}
.rep-head{display:flex;align-items:center;gap:16px;padding:16px 24px 14px;border-bottom:1px solid var(--line);min-width:0}
.tabs{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--field);border:1px solid var(--line);flex:none}
.tab{appearance:none;height:28px;padding:0 12px;border-radius:7px;border:0;background:transparent;cursor:pointer;font-size:13px;color:var(--text-2);white-space:nowrap}
.tab.on{background:var(--raise);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tabs.sm .tab{height:26px;flex:1}
.tabs.sm{display:flex}
.rep-body{overflow:auto;padding:20px 24px 40px;min-height:0}
.rep-sum{display:flex;align-items:center;gap:16px;padding:16px 18px}
.rep-n{font-size:28px;font-weight:650;min-width:36px;text-align:center}
.rep-n.okc{color:var(--ok)}
.rep-st{font-size:14px;font-weight:600}
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.stat{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card)}
.stat .n{font-size:22px;font-weight:650;display:flex;align-items:center;gap:6px}
.stat .n svg{width:15px;height:15px;color:var(--warn)}
.stat .l{font-size:12px;color:var(--text-2);margin-top:2px}
.hibp{display:flex;gap:16px;padding:18px;align-items:flex-start}
.hibp p{margin:4px 0 14px;font-size:13px}
.hibp-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--field);color:var(--accent);flex:none}
.hibp-ic svg{width:22px;height:22px}
.spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line-2);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none;margin:9px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Unlock */
.unlock{grid-column:1 / -1;display:grid;grid-template-rows:52px minmax(0,1fr);position:relative;min-height:0}
.unlock-glow{position:absolute;inset:0;background:radial-gradient(55% 45% at 50% 42%,var(--glow),transparent 72%);pointer-events:none}
.unlock-top{display:flex;align-items:center;gap:14px;padding:0 16px 0 18px;position:relative;z-index:2}
.unlock-top .dbsw{width:auto;padding:4px 8px}
.unlock-top .dbname{font-size:13px}
.unlock-top .menu{left:0;right:auto;width:240px}
.unlock-center{display:grid;place-items:center;padding-bottom:52px;position:relative}
.ucard{position:relative;width:380px;text-align:center;margin:0}
.ucard h1{font-size:22px;font-weight:650;margin:16px 0 4px;letter-spacing:-.01em}
.upath{font-size:12px;color:var(--text-2);margin-bottom:24px}
.uerr{color:var(--danger);font-size:12px;text-align:left;margin:6px 2px 0;min-height:17px}
.ubtn{width:100%;height:40px;font-size:14px;margin-top:4px}
.ulinks{display:flex;justify-content:center;gap:18px;margin-top:16px}
.ukey{text-align:left;margin:4px 0 12px}
.ulabel{font-size:12px;color:var(--text-2);margin:0 0 6px 2px}
.touch{width:100%;height:44px;font-size:14px}
.touch svg{width:18px;height:18px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.scan{animation:pulse .7s ease-in-out}
@keyframes pulse{50%{opacity:.55;transform:scale(.98)}}

/* Dialogs and toast */
.overlay{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.42)}
.win.light .overlay{background:rgba(20,24,40,.2)}
.dialog{width:430px;max-height:640px;overflow:auto;border-radius:12px;background:var(--raise);border:1px solid var(--line-2);box-shadow:0 24px 64px rgba(0,0,0,.4);padding:20px;animation:din .14s ease-out}
@keyframes din{from{opacity:0;transform:translateY(4px) scale(.99)}}
.dialog h2{margin:0 0 6px;font-size:16px;font-weight:600}
.dialog p{margin:0 0 12px;color:var(--text-2);font-size:13px}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.dialog .fr{grid-template-columns:110px minmax(0,1fr)}
.dialog .err{color:var(--danger);font-size:12px;margin-top:6px}
.qr-wrap{width:196px;height:196px;margin:8px auto 4px;background:#fff;color:#000;border-radius:12px;padding:10px}
.qr-wrap svg{width:100%;height:100%;display:block}
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;background:var(--raise);border:1px solid var(--line-2);box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13px;white-space:nowrap;animation:tin .18s ease-out}
.toast svg{width:15px;height:15px;color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}}

/* Design values section */
.values{display:flex;flex-direction:column;gap:14px;scroll-margin-top:12px}
.values h2{font-size:15px;margin:0}
.values .sub{font-size:12px;color:var(--muted-foreground,#6b6f76);margin-top:3px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.vbox{border:1px solid var(--border,rgba(127,127,127,.25));border-radius:var(--radius,10px);padding:16px}
.vbox.wide{grid-column:1 / -1}
.vbox h3{margin:0 0 10px;font-size:13px}
.sw{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;font-size:12px;padding:3px 0}
.sw i{width:22px;height:22px;border-radius:6px;border:1px solid rgba(127,127,127,.35)}
.sw code,.vt code{font-family:var(--font-mono,ui-monospace,Menlo,monospace);font-size:11px;color:var(--muted-foreground,#6b6f76)}
.vt{width:100%;border-collapse:collapse;font-size:12px}
.vt td{padding:6px 0;border-bottom:1px solid var(--border,rgba(127,127,127,.18));vertical-align:top}
.vt tr:last-child td{border-bottom:0}
.vt td+td{padding-left:12px}
.vt td:last-child{text-align:right}
.vt.map td:last-child{text-align:left}
</style>
</head>

/* ---------- Derived data ---------- */
function groupById(id) { return db().groups.find((g) => g.id === id); }
function groupPath(id) { const out = []; let g = groupById(id); while (g) { out.unshift(g.name); g = g.parent ? groupById(g.parent) : null; } return out; }
function pathText(e) { return groupPath(e.group).join(' › ') || db().name; }
function active() { return db().entries.filter((e) => e.group !== 'bin'); }
function binEntries() { return db().entries.filter((e) => e.group === 'bin'); }
function selected() { return db().entries.find((e) => e.id === UI().sel) || null; }
function resolve(v) {
  const m = /^\{REF:([UP])@I:([0-9A-F]{32})\}$/i.exec(v || '');
  if (!m) return v;
  const t = db().entries.find((x) => x.uuid.toUpperCase() === m[2].toUpperCase());
  return t ? (m[1].toUpperCase() === 'U' ? t.username : t.password) : v;
}
function isExpired(e) { return !!e.expires && D(e.expires) < new Date(); }
function bits(pw) {
  if (!pw) return 0;
  let pool = 0;
  if (/[a-z]/.test(pw)) pool += 26;
  if (/[A-Z]/.test(pw)) pool += 26;
  if (/[0-9]/.test(pw)) pool += 10;
  if (/[^A-Za-z0-9]/.test(pw)) pool += 33;
  let b = pw.length * Math.log2(pool);
  const low = pw.toLowerCase();
  if (COMMON.some((w) => low.includes(w))) b = Math.min(b, 18 + 1.2 * (pw.length - 5));
  return Math.max(1, Math.round(b));
}
function quality(b) { return b <= 0 ? 'Bad' : b < 40 ? 'Poor' : b < 75 ? 'Weak' : b < 100 ? 'Good' : 'Excellent'; }
function qColor(q) { return q === 'Excellent' || q === 'Good' ? 'var(--ok)' : q === 'Weak' ? 'var(--warn)' : q === 'Poor' ? 'var(--poor)' : 'var(--danger)'; }
function isWeak(e) { const p = resolve(e.password); return !!p && bits(p) < 75; }
function reuseCount(e) { const p = resolve(e.password); if (!p) return 0; return active().filter((x) => resolve(x.password) === p).length; }
function health(e) {
  const p = resolve(e.password);
  if (!p || e.excludeReports) return null;
  const b = bits(p), reuse = reuseCount(e), expired = isExpired(e);
  let score = b;
  const reasons = [];
  if (expired) { score = 0; reasons.push('Past its expiry date'); }
  if (reuse > 1) { score = Math.min(score, 35 - 5 * (reuse - 1)); reasons.push(`Same password on ${reuse} entries`); }
  if (b < 40) reasons.push('Very easy to guess'); else if (b < 75) reasons.push('Somewhat easy to guess');
  return { score, q: quality(score), reasons, bits: b };
}
function healthList() {
  return active().map((e) => ({ e, h: health(e) })).filter((x) => x.h && ['Bad', 'Poor', 'Weak'].includes(x.h.q)).sort((a, b) => a.h.score - b.h.score);
}
function matches(e, q) {
  return q.trim().split(/\s+/).filter(Boolean).every((t) => {
    const m = /^(title|user|username|url|notes|tag|is):(.*)$/i.exec(t);
    if (m) {
      const f = m[1].toLowerCase(), v = m[2].toLowerCase();
      if (f === 'is') return v === 'expired' ? isExpired(e) : v === 'weak' ? isWeak(e) : true;
      if (f === 'tag') return e.tags.some((x) => x.toLowerCase().includes(v));
      const field = f === 'title' ? e.title : (f === 'user' || f === 'username') ? resolve(e.username) : f === 'url' ? e.url : e.notes;
      return (field || '').toLowerCase().includes(v);
    }
    const v = t.toLowerCase();
    return [e.title, resolve(e.username), e.url, e.notes, ...e.tags].some((x) => (x || '').toLowerCase().includes(v));
  });
}
function listEntries() {
  const ui = UI(), v = ui.view;
  let arr;
  if (ui.search.trim()) arr = active().filter((e) => matches(e, ui.search));
  else if (v.kind === 'recycle') arr = binEntries();
  else if (v.kind === 'expired') arr = active().filter(isExpired);
  else if (v.kind === 'weak') arr = active().filter(isWeak);
  else if (v.kind === 'group') arr = active().filter((e) => e.group === v.id);
  else if (v.kind === 'tag') arr = active().filter((e) => e.tags.includes(v.id));
  else arr = active();
  const k = ui.sort.key, dir = ui.sort.dir === 'asc' ? 1 : -1;
  return arr.slice().sort((a, b) => {
    if (k === 'title' || k === 'username') {
      const x = (a[k] || '').toLowerCase(), y = (b[k] || '').toLowerCase();
      return x < y ? -dir : x > y ? dir : 0;
    }
    return (D(a[k]).getTime() - D(b[k]).getTime()) * dir;
  });
}
function ensureSel(items) { const ui = UI(); if (!items.some((e) => e.id === ui.sel)) ui.sel = items.length ? items[0].id : null; }
function viewTitle() {
  const ui = UI(), v = ui.view;

  if (v.kind === 'all') return 'All Entries';
  if (v.kind === 'expired') return 'Expired';
  if (v.kind === 'weak') return 'Weak Passwords';
  if (v.kind === 'recycle') return 'Recycle Bin';
  if (v.kind === 'tag') return v.id;
  if (v.kind === 'group') return (groupById(v.id) || { name: '' }).name;

/* ---------- TOTP (fake codes that change every 30 seconds) ---------- */
function totpCode(t) {
  const step = t.step || 30, ctr = Math.floor(Date.now() / 1000 / step);
  let h = hash(t.seed + ':' + ctr);
  if (t.steam) { let s = ''; for (let i = 0; i < 5; i++) { s += STEAM[h % STEAM.length]; h = Math.floor(h / STEAM.length); } return s; }
  const n = t.digits || 6;
  return String(h % Math.pow(10, n)).padStart(n, '0');
}
const fmtCode = (c) => (c.length === 6 ? c.slice(0, 3) + ' ' + c.slice(3) : c.length === 8 ? c.slice(0, 4) + ' ' + c.slice(4) : c);
const remaining = (step) => step - (Math.floor(Date.now() / 1000) % step);
function ring(step, r) {
  const C = 2 * Math.PI * 8;
  return `<svg class="ring${r <= 5 ? ' low' : ''}" viewBox="0 0 20 20" data-totp-ring data-step="${step}"><circle class="bg" cx="10" cy="10" r="8" fill="none" stroke-width="2.4"/><circle class="fg" cx="10" cy="10" r="8" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - r / step)).toFixed(2)}"/></svg>`;
}
function totpHtml(t) {
  const r = remaining(t.step);
  return `<div class="totp"><span class="totp-code mono" data-totp-code data-seed="${esc(t.seed)}" data-step="${t.step}" data-digits="${t.digits}" data-steam="${t.steam ? 1 : ''}">${fmtCode(totpCode(t))}</span>${ring(t.step, r)}<span class="totp-sec" data-totp-sec data-step="${t.step}">${r}s</span></div>`;
}
function tick() {
  document.querySelectorAll('[data-totp-code]').forEach((el) => { el.textContent = fmtCode(totpCode({ seed: el.dataset.seed, step: +el.dataset.step, digits: +el.dataset.digits, steam: !!el.dataset.steam })); });
  document.querySelectorAll('[data-totp-ring]').forEach((el) => {
    const step = +el.dataset.step, r = remaining(step), C = 2 * Math.PI * 8, fg = el.querySelector('.fg');
    el.classList.toggle('low', r <= 5);
    if (r === step) { fg.style.transition = 'none'; fg.setAttribute('stroke-dashoffset', '0'); fg.getBoundingClientRect(); fg.style.transition = ''; } else fg.setAttribute('stroke-dashoffset', (C * (1 - r / step)).toFixed(2));
  });
  document.querySelectorAll('[data-totp-sec]').forEach((el) => { el.textContent = remaining(+el.dataset.step) + 's'; });
}

/* ---------- Small building blocks ---------- */
function tileStyle(seed) {
  const hues = [222, 262, 292, 332, 12, 32, 152, 182, 202, 242];
  const h = hues[hash(seed) % hues.length];
  return S.theme === 'dark' ? `--tile-bg:hsl(${h} 38% 24%);--tile-fg:hsl(${h} 80% 82%)` : `--tile-bg:hsl(${h} 75% 93%);--tile-fg:hsl(${h} 55% 36%)`;
}
function mono(title) { const t = (title || '').replace(/[^\p{L}\p{N}]/gu, ''); return t ? t.charAt(0).toUpperCase() + t.charAt(1).toLowerCase() : '?'; }
function tile(e, size) {

}

/* ---------- Render ---------- */
// Re-rendering removes and re-focuses inputs; focus events fired during that must not render again.
let rendering = false;
function render() {
  rendering = true;
  try { renderNow(); } finally { rendering = false; }
}
function renderNow() {
  const f = captureFocus(), sc = captureScroll();
  stage.className = 'stage ' + S.theme;
  win.className = 'win ' + S.theme + (S.screen !== 'unlock' && S.sideHidden ? ' noside' : '');
  Object.entries(TOKENS[S.theme]).forEach(([k, v]) => win.style.setProperty('--' + k, v));
  win.innerHTML = S.screen === 'unlock'
    ? renderUnlock() + renderOverlays()
    : (S.sideHidden ? '' : renderSidebar()) + renderContent() + renderOverlays();
  restoreScroll(sc);
  restoreFocus(f);
  tick();
  document.querySelectorAll('[data-act="theme"]').forEach((b) => b.classList.toggle('on', b.dataset.arg === S.theme));
  document.querySelectorAll('[data-act="jump"]').forEach((b) => b.classList.toggle('on', b.dataset.arg === S.screen));
}
function captureFocus() {
  const a = document.activeElement;
  if (!a || !a.id || !win.contains(a)) return null;
  let s = null, e = null;
  try { s = a.selectionStart; e = a.selectionEnd; } catch (err) { /* not a text field */ }
  return { id: a.id, s, e };
}
function restoreFocus(f) {
  if (!f) return;
  const el = document.getElementById(f.id);
  if (!el) return;
  el.focus({ preventScroll: true });
  try { if (f.s != null) el.setSelectionRange(f.s, f.e); } catch (err) { /* not a text field */ }
}
function captureScroll() { const m = {}; win.querySelectorAll('[data-scroll]').forEach((el) => { m[el.dataset.scroll] = { top: el.scrollTop, owner: el.dataset.owner || '' }; }); return m; }
function restoreScroll(m) { win.querySelectorAll('[data-scroll]').forEach((el) => { const s = m[el.dataset.scroll]; if (s && s.owner === (el.dataset.owner || '')) el.scrollTop = s.top; }); }

/* ---------- Password generator ---------- */
function rnd(n) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
function regen() {
  const g = S.gen;
  if (g.type === 'passphrase') {
    const w = [];
    for (let i = 0; i < g.words; i++) {
      let x = WORDS[rnd(WORDS.length)];
      if (g.wcase === 'upper') x = x.toUpperCase(); else if (g.wcase === 'title') x = x.charAt(0).toUpperCase() + x.slice(1);
      w.push(x);
    }
    g.value = w.join(g.sep);
    return;
  }
  const strip = (s) => (g.excludeAlike ? Array.from(s).filter((c) => !ALIKE.includes(c)).join('') : s);
  const sets = [];
  if (g.lower) sets.push(strip(LOWER));
  if (g.upper) sets.push(strip(UPPER));
  if (g.digits) sets.push(strip(DIGITS));
  if (g.special) sets.push(strip(SPECIAL));
  if (g.ext) sets.push(EXTENDED);
  if (!sets.length) { g.value = ''; return; }
  const all = sets.join('');
  let out = [];
  if (g.every) sets.forEach((s) => out.push(s.charAt(rnd(s.length))));
  while (out.length < g.length) out.push(all.charAt(rnd(all.length)));
  out = out.slice(0, g.length);
  for (let i = out.length - 1; i > 0; i--) { const j = rnd(i + 1); const t = out[i]; out[i] = out[j]; out[j] = t; }
  g.value = out.join('');
}
function genBits() {
  const g = S.gen;
  if (g.type === 'passphrase') return Math.round(g.words * Math.log2(7776));
  let pool = 0;
  if (g.lower) pool += 26; if (g.upper) pool += 26; if (g.digits) pool += 10; if (g.special) pool += SPECIAL.length; if (g.ext) pool += EXTENDED.length;
  return pool ? Math.round(g.length * Math.log2(pool)) : 0;
}
function genMeter() { const b = genBits(), q = quality(b); return `<div class="meter-bar"><i style="width:${Math.min(100, b / 1.28)}%;background:${qColor(q)}"></i></div><span>${q} · ${b} bits</span>`; }
function renderGen(mode) {
  const g = S.gen;
  if (!g.value) regen();
  const tabs = `<div class="tabs sm"><button type="button" class="tab${g.type === 'password' ? ' on' : ''}" data-act="gen-type" data-arg="password">Password</button><button type="button" class="tab${g.type === 'passphrase' ? ' on' : ''}" data-act="gen-type" data-arg="passphrase">Passphrase</button></div>`;
  const out = `<div class="gen-out"><div class="v mono pw" data-gen-out>${pwHtml(g.value, true)}</div>${ibtn('refresh', 'Regenerate password', 'gen-regen')}${ibtn('copy', 'Copy password', 'gen-copy')}</div><div class="meter" data-gen-q>${genMeter()}</div>`;
  const opts = g.type === 'password'
    ? `<div class="gen-row"><span>Length</span><span class="sp"></span><b data-gen-len>${g.length}</b></div><input class="range" type="range" min="8" max="64" value="${g.length}" data-gen-range="length" aria-label="Password length">
       <div class="optchips">${[['upper', 'A-Z'], ['lower', 'a-z'], ['digits', '0-9'], ['special', '/ * + & …'], ['ext', 'Extended ASCII']].map(([k, l]) => `<button type="button" class="opt${g[k] ? ' on' : ''}" data-act="gen-opt" data-arg="${k}">${l}</button>`).join('')}</div>
       ${checkRow('Skip characters that are easy to confuse', '', 'gen.excludeAlike', g.excludeAlike)}${checkRow('Use each chosen group at least once', '', 'gen.every', g.every)}`
    : `<div class="gen-row"><span>Word count</span><span class="sp"></span><b data-gen-len>${g.words}</b></div><input class="range" type="range" min="3" max="12" value="${g.words}" data-gen-range="words" aria-label="Word count">
       <div class="gen-grid"><label>Word separator${inp('gen-sep', 'gen.sep', g.sep, {})}</label><div>Word case<div class="optchips">${[['lower', 'lower'], ['upper', 'UPPER'], ['title', 'Title']].map(([k, l]) => `<button type="button" class="opt${g.wcase === k ? ' on' : ''}" data-act="gen-case" data-arg="${k}">${l}</button>`).join('')}</div></div></div>`;
  const foot = mode === 'edit'
    ? '<div class="gen-foot"><button type="button" class="btn sm" data-act="menu" data-arg="gen-edit">Cancel</button><button type="button" class="btn sm primary" data-act="gen-apply">Apply Password</button></div>'
    : '<div class="gen-foot"><button type="button" class="btn sm" data-act="menu" data-arg="gen-tool">Close</button><button type="button" class="btn sm primary" data-act="gen-copy">Copy</button></div>';

/* ---------- Dialogs and toast ---------- */
function qrSvg(seed) {
  const n = 25;
  let cells = '', h = hash(seed);
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      if ((x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16)) continue;
      h = Math.imul(h ^ (x * 31 + y * 17 + 7), 2654435761) >>> 0;
      if ((h >>> 9) & 1) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    }
  }
  return `<svg viewBox="0 0 25 25" fill="#000" shape-rendering="crispEdges">${cells}${finder(0, 0)}${finder(18, 0)}${finder(0, 18)}</svg>`;
}

  if (!b) return;
  setBind(b, t.value);
  if (b === 'u.pw' && S.u.err) S.u.err = '';
  if (b.indexOf('gen.') === 0) regen();
  if (b === 'ui.search') UI().sel = null;
  render();
});
document.addEventListener('change', (ev) => { if (ev.target.dataset.genRange) render(); });
document.addEventListener('focusin', (ev) => { if (!rendering && ev.target.id === 'q' && !S.searchHelp) { S.searchHelp = true; if (!UI().search) render(); } });
document.addEventListener('focusout', (ev) => { if (!rendering && ev.target.id === 'q') { S.searchHelp = false; const h = win.querySelector('.search-help'); if (h) h.remove(); } });
document.addEventListener('keydown', (ev) => {
  const t = ev.target, tag = (t.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
  const mod = ev.metaKey || ev.ctrlKey, k = (ev.key || '').toLowerCase();
  if (t.hasAttribute && t.hasAttribute('data-tag-input')) {
    if ((ev.key === 'Enter' || ev.key === ',') && t.value.trim()) {
      ev.preventDefault();
      const v = t.value.trim().replace(/,$/, '');
      if (v && !S.draft.tags.includes(v)) S.draft.tags.push(v);
      t.value = '';
      render();
      const n = $('#ed-tag'); if (n) n.focus();
      return;
    }
    if (ev.key === 'Backspace' && !t.value && S.draft.tags.length) { S.draft.tags.pop(); render(); const n = $('#ed-tag'); if (n) n.focus(); return; }
  }
  if (ev.key === 'Escape') {
    if (S.modal) { S.modal = null; render(); return; }
    if (S.menu) { S.menu = null; render(); return; }
    if (S.screen === 'edit') { A['ed-cancel'](); return; }
    if (S.screen === 'main' && UI().search) { UI().search = ''; render(); }
    return;
  }
  if (S.modal) {
    if (ev.key === 'Enter' && tag === 'input') {
      ev.preventDefault();
      const go = { 'new-group': 'new-group-confirm', 'totp-setup': 'totp-confirm' }[S.modal.type];
      if (go) A[go]();
    }
    return;
  }
  if (S.screen === 'unlock') return;
  if (mod && k === 'l') { ev.preventDefault(); A.lock(); return; }
  if (S.screen === 'edit') { if (mod && k === 's') { ev.preventDefault(); A['ed-save'](); } return; }
  if (mod && k === 'f') { ev.preventDefault(); if (S.screen !== 'main') { S.screen = 'main'; render(); } const q = $('#q'); if (q) { q.focus(); q.select(); } return; }
  if (mod && k === 'n') { ev.preventDefault(); A['new-entry'](); return; }
  if (S.screen !== 'main') return;
  if (mod && k === 'e') { ev.preventDefault(); A.edit(); return; }
  if (mod && !typing) {
    if (k === 'c' && !String(window.getSelection())) { ev.preventDefault(); A.copy('password'); return; }
    if (k === 'b') { ev.preventDefault(); A.copy('username'); return; }
    if (k === 't') { ev.preventDefault(); A.copy('totp'); return; }
    if (k === 'u') { ev.preventDefault(); const e = selected(); if (e) A['open-url'](e.url); return; }
  }
  if ((ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && (!typing || t.id === 'q')) { ev.preventDefault(); moveSel(ev.key === 'ArrowDown' ? 1 : -1); return; }
  if (ev.key === 'Enter' && !typing) { A.edit(); return; }
  if ((ev.key === 'Delete' || ev.key === 'Backspace') && !typing) { ev.preventDefault(); A.delete(); }
});

/* ---------- Design values section ---------- */
function renderValues() {
  const sw = (theme) => TOKEN_LABELS.map(([k, label]) => { const v = TOKENS[theme][k], base = theme === 'dark' ? '#141519' : '#ffffff'; return `<div class="sw"><i style="background:linear-gradient(${v},${v}),${base}"></i><span>${label}</span><code>${v}</code></div>`; }).join('');
  const rows = (list) => list.map(([a, b]) => `<tr><td>${a}</td><td><code>${b}</code></td></tr>`).join('');
  $('#values').innerHTML = `<div><h2>Design values</h2><div class="sub">The app's theme uses these values. The window above reads the same table.</div></div>
    <div class="vgrid">
      <div class="vbox"><h3>Dark</h3>${sw('dark')}</div>
      <div class="vbox"><h3>Light</h3>${sw('light')}</div>
      <div class="vbox"><h3>Type</h3><table class="vt">${rows([['Font', 'System: SF Pro, Segoe UI, Cantarell'], ['Passwords, codes', 'System mono: SF Mono, Consolas'], ['Section header', '11 px · 600 · caps'], ['Field label', '12 px · 500 · label color'], ['Secondary line', '12 px · 400'], ['Body, menu', '13 px · 400'], ['List title, field value', '14 px · 500 / 400'], ['Editor and report title', '15 px · 600'], ['Entry title', '24 px · 650']])}</table></div>
      <div class="vbox"><h3>Shape and size</h3><table class="vt">${rows([['Window corner', '12 px'], ['Card corner', '10 px'], ['Row, field, button corner', '8 px'], ['Big tile corner', '16 px'], ['Spacing steps', '4 · 8 · 12 · 16 · 24 · 32'], ['Title bar', '52 px'], ['Sidebar · list', '232 px · 328 px'], ['List row · tile', '52 px · 32 px'], ['Sidebar row', '30 px'], ['Field · button', '34 px · 32 px']])}</table></div>
      <div class="vbox wide"><h3>Where each part lives in the app</h3><table class="vt map">${rows([['Colors, corners, sizes', 'ui/styles.css, from the values on this page'], ['Sidebar: vaults, groups, tags', 'ui/ · app-desktop session commands · app-core'], ['Toolbar: search, generator, lock, New Entry', 'ui/ · app-core search and generator · app-desktop lock'], ['Entry list rows and month headers', 'ui/ · app-desktop list command (no secrets)'], ['Entry detail cards', 'ui/ · app-desktop entry view, Show and Copy commands'], ['Unlock screen', 'ui/ · app-format keys · app-platform Touch ID'], ['Entry editor, 8 pages', 'ui/ · app-core edits with history'], ['Reports', 'app-core health check and statistics · app-platform breach check'], ['Dialogs: clone, TOTP setup, QR code', 'ui/ · app-core']])}</table></div>
    </div>`;
}

/* ---------- Start ---------- */
function fit() {
  const cs = getComputedStyle(stage);
  const avail = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  zoomer.style.zoom = Math.min(1, avail / 1180);
}
S.theme = START.theme || 'dark';
if (START.db) S.dbId = START.db;
if (START.unlocked || (START.screen && START.screen !== 'unlock')) { S.unlocked[S.dbId] = true; S.quick[S.dbId] = true; S.screen = 'main'; }
if (START.quick) S.quick[S.dbId] = true;
if (START.sel) UI().sel = START.sel;
if (START.view) UI().view = START.view;
if (START.search) UI().search = START.search;
if (START.reveal) S.reveal[START.reveal] = true;
if (START.foot) S.footOpen = true;
if (START.screen === 'reports') { S.screen = 'reports'; if (START.repTab) S.repTab = START.repTab; if (START.hibp) S.hibp = START.hibp; }
renderValues();
render();
if (START.screen === 'edit') { const e = selected() || active()[0]; UI().sel = e.id; openEditor(e, START.edTab); }
if (START.menu) { S.menu = START.menu; if (START.menu.indexOf('gen') === 0) regen(); render(); }
if (START.modal) { const e = selected(); S.modal = Object.assign({ id: e && e.id }, START.modal); render(); }
fit();
window.addEventListener('resize', fit);
setInterval(tick, 1000);
})();
</script>
