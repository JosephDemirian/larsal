# cargo-fuzz targets (plan/architecture.md, fuzz/). Run from the project
# root: cargo +nightly fuzz run <target>. Not a member of the main
# workspace: it has its own, so the pinned stable toolchain never builds it.
[package]
name = "larsal-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license-file = "../LICENSE"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
larsal-format = { path = "../crates/larsal-format" }
larsal-model = { path = "../crates/larsal-model" }
larsal-crypto = { path = "../crates/larsal-crypto" }
larsal-core = { path = "../crates/larsal-core" }
larsal-autotype = { path = "../crates/larsal-autotype" }
larsal-sshagent = { path = "../crates/larsal-sshagent" }
larsal-share = { path = "../crates/larsal-share" }
# E16-S3: the sync wire format (SYN-01.15).
larsal-proto = { path = "../crates/larsal-proto" }
# E7-S1: Larsal's side of the browser bridge (INT-01.48).
larsal-browser = { path = "../crates/larsal-browser" }
# E22-S3: file encryption (FIL-01, FIL-03).
larsal-files = { path = "../crates/larsal-files", features = ["fuzz-door"] }
# E23-S3: a folder of files encrypted one by one, classic format 8 (FIL-04).
larsal-folders = { path = "../crates/larsal-folders", features = ["fuzz-door"] }
png = { version = "=0.18.1", default-features = false }
# E4-S13: the import targets build ZIP files from fuzz input (base64 from larsal-crypto).
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[workspace]
members = ["."]

# LD-136: Larsal's patched copy of zxcvbn, as in the root workspace.
[patch.crates-io]
zxcvbn = { path = "../vendor/zxcvbn" }
# LD-209: Larsal's patched copy of ssh-key, as in the root workspace.
ssh-key = { path = "../vendor/ssh-key" }

# Outer header, KDF map and public custom data map (FMT-02, FMT-03; E3-S2).
[[bin]]
name = "vault_header"
path = "fuzz_targets/vault_header.rs"
test = false
doc = false
bench = false

# Whole open of a vault file with a fixed password and cheap key settings (FMT-01 to FMT-17; E3-S10).
[[bin]]
name = "vault_open"
path = "fuzz_targets/vault_open.rs"
