[package]
name = "app-sync"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# E16-S7a: App's sync client (spec SYN-03, SYN-04; P3, P4): sign-in with
# the device key, the sync loop and its timing, the rollback guard and the
# local state. Only app-ffi's `sync` feature links it, so an app-ffi built
# without that feature links nothing of this crate (architecture, "Sync
# server and sharing"). Its HTTP goes only through app-platform `net.rs`
# (Rust rule 12), its crypto only through app-crypto (AGENTS.md rule 3).
[features]
# The sign-in key (SYN-04.1): app-platform `device_key.rs` behind
# `client::Signer`. app-ffi's `sync` turns it on; without it this crate
# links no keychain code.
sync = ["app-platform/device-key"]
# Tests only (LD-317 (2), LD-327 (6)): `test_server`, with app-server in
# process, a scripted TLS server, the test proxy, a test clock and the
# test-seam device key. app-sync's own tests turn it on through the
# dev-dependency on itself below, app-ffi's through its dev-dependency;
# never a product build.
test-server = [
    "sync",
    "app-platform/test-device-key",
    "dep:app-server",
    "dep:tokio",
    "dep:rustls",
    "dep:rcgen",
]

[dependencies]
app-proto = { workspace = true }
app-crypto = { workspace = true }
app-model = { workspace = true }
# guard.rs (the rollback guard's measures) and the state file's safe write.
app-core = { workspace = true }
# `net`: the pinned HTTPS client (SYN-01.2); `macos::open_regular` for the
# state file.
app-platform = { workspace = true, features = ["net"] }
# `test-server` only.
app-server = { workspace = true, features = ["test-seams"], optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }
rustls = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }

[dev-dependencies]
app-sync = { workspace = true, features = ["test-server"] }

[lints]
workspace = true
