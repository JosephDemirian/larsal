[package]
name = "app-bridge"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# E7-S6: the host program the browsers start (INT-01.1 to INT-01.5,
# plan/architecture.md): a relay of length-prefixed frames between standard
# input and output and App's bridge socket. It holds no key and opens no box,
# so it links no app-crypto, app-format or app-core; app-platform without
# features is libc only (the hardening of APP-11 and the user temp folder).
[[bin]]
name = "app-bridge"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
app-platform = { workspace = true }

[dev-dependencies]
# The tests' App side: App's own bridge socket and channel (E7-S1), so a
# hello through app-bridge gets App's real reply. Tests only, never linked
# into app-bridge.
app-browser = { workspace = true }
app-crypto = { workspace = true }
app-model = { workspace = true }
