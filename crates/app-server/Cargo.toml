[package]
name = "app-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
# D2, LD-262 (3), LD-303 (4): the server is AGPL-3.0, in the same "or later"
# form as App's GPL-3.0-or-later.
license = "AGPL-3.0-or-later"

# E16-S3: App's sync server (spec SYN-01, SYN-02; P14, P17). Its own network
# and TLS code is the exception of P20 (LD-263 (18)): tokio-rustls, rustls,
# ring, and rcgen for the TLS certificate and key only. It never names
# app-format, app-core, app-platform, app-ffi or app-sync (P16,
# scripts/check-server-blind.sh).
[dependencies]
app-crypto = { workspace = true }
app-proto = { workspace = true }
# `fs` and `io-util`: vault files stream in and out on tokio's blocking pool
# (E16-S4, SYN-02.4, SYN-02.7).
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "fs", "io-util"] }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio", "server", "http1"] }
http-body-util = { workspace = true }
# TLS 1.2 and 1.3 (SYN-01.1): `tls12` here, since no other crate of the
# server turns it on (LD-303 (4)).
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
# P17: the first-start demo certificate.
rcgen = { workspace = true }
# P15, P22: SQLite from its bundled source, for the store (SYN-02.2).
rusqlite = { workspace = true, features = ["bundled"] }

[features]
# E16-S5: the test clock and SYN-04.11's second-device helper (lib.rs
# `TestSeams`). Only app-server's own tests turn it on, through the
# dev-dependency on itself below; a release server has neither.
test-seams = []

[dev-dependencies]
app-server = { workspace = true, features = ["test-seams"] }
# E16-S5: the test client's software P-256 device key (sign.rs
# `P256TestKey`); tests only.
app-crypto = { workspace = true, features = ["test-p256-key"] }

[lints]
workspace = true
