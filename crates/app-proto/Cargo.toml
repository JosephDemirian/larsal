[package]
name = "app-proto"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# E16-S3: App's sync wire format (spec SYN-01), shared by app-server and,
# from E16-S7a, app-sync. Records are read and written with app-model's
# json.rs only (P14). It never names app-format, app-core or app-platform:
# app-server links it, and the server never links the vault reader (P16).
[dependencies]
app-model = { workspace = true }
# E16-S5: the sign-in message's field list and P-256 check (signin.rs,
# CRY-04.2, CRY-04.4), base64url (SYN-01.8) and the wrap record (wrap.rs,
# CRY-04.6). Crypto only through app-crypto (AGENTS.md rule 3).
app-crypto = { workspace = true }

[dev-dependencies]
# Only to check that the vault body limit is FMT-01.31's (SYN-01.10). A
# dev-dependency of app-proto is not in app-server's tree (P16).
app-format = { workspace = true }
# E16-S5: a software P-256 key signs the sign-in message in signin.rs's tests.
app-crypto = { workspace = true, features = ["test-p256-key"] }

[lints]
workspace = true
