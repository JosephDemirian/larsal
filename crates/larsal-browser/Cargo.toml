[package]
name = "larsal-browser"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

# E7-S1: Larsal's side of the browser bridge (spec INT-01): the channel, its
# sessions and limits, and the two sockets. The channel's crypto is
# larsal-crypto's (bridge.rs, AGENTS rule 3); JSON is larsal-model's reader; the
# peer check is larsal-platform's. No outside crate (LD-307).
# E7-S3: URL matching (INT-03) resolves entry URLs and reads hosts through
# larsal-core (MOD-08, MOD-08.9's host form); the Public Suffix List is a file
# in vendor/public-suffix-list/ compiled in (LD-303 (6)). No outside crate.
# E7-S6: the setup files and the two sockets' places (INT-01.6 to INT-01.15).
[dependencies]
larsal-core = { workspace = true }
larsal-crypto = { workspace = true }
larsal-model = { workspace = true }
# E7-S6: `code-sign`, the peer program check of signed builds (INT-01.7).
larsal-platform = { workspace = true, features = ["code-sign"] }

[lints]
workspace = true
