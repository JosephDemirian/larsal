[package]
name = "larsal-crypto"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

# Approved crates only (plan/architecture.md). "zeroize" is on wherever the
# crate has it, so key schedules and buffers inside the crates are wiped too.
# Except blake2 inside argon2: not a dependency of ours; the stack wipe after
# derive covers it (spec/decisions.md LD-69).
[dependencies]
zeroize.workspace = true
subtle.workspace = true
# sys_rng: getrandom's OS source as a rand_core generator.
getrandom = { workspace = true, features = ["sys_rng"] }
rand_core.workspace = true
sha2 = { workspace = true, features = ["zeroize"] }
sha1 = { workspace = true, features = ["zeroize"] }
hmac = { workspace = true, features = ["zeroize"] }
aes = { workspace = true, features = ["zeroize"] }
cbc = { workspace = true, features = ["zeroize"] }
twofish = { workspace = true, features = ["zeroize"] }
chacha20 = { workspace = true, features = ["zeroize"] }
salsa20 = { workspace = true, features = ["zeroize"] }
argon2 = { workspace = true, features = ["zeroize"] }
# LD-142: PBKDF2 and HKDF for encrypted imports (FEA-08). They run on the
# hmac crate above, so its "zeroize" feature covers their HMAC states.
pbkdf2.workspace = true
hkdf.workspace = true
# E9-S1: OpenSSH private keys for the SSH agent (ssh.rs; INT-06). "encryption"
# reads protected keys (bcrypt-pbkdf, AES, ChaCha20-Poly1305); the private key
# types of ssh-key wipe themselves on drop. bcrypt-pbkdf is named only to turn
# on its "zeroize".
ssh-key = { workspace = true, features = ["alloc", "ecdsa", "encryption", "ed25519", "p256", "p384", "p521", "rsa"] }
bcrypt-pbkdf = { workspace = true, features = ["zeroize"] }
# E24-S2 (INT-06.E24.01, .02): New SSH Key. ssh-key's `ed25519`, `p256`, `p384`, `p521`
# and `rsa` features above make the keys with its own types; named here only to pin
# them to the reviewed versions (ssh-key turns on what it needs).
p384.workspace = true
p521.workspace = true
rsa.workspace = true
# E9-S2: Larsal's own SSH agent (ssh.rs; INT-06.33) signs with Ed25519 and ECDSA
# P-256 and checks session bindings with them. ssh-key never signs (LD-182 (2)).
ed25519-dalek = { workspace = true, features = ["zeroize"] }
p256 = { workspace = true, features = ["ecdsa"] }
# E0-S7 R5 (LD-258 (2)): base64.rs, base64 for our crates (keys, imports, key files).
base64ct.workspace = true
# E16-S2 (CRY-04): hpke.rs, HPKE base mode with DHKEM(X25519, HKDF-SHA256),
# HKDF-SHA256 and AES-256-GCM (no getrandom: larsal-crypto::random gives every
# random byte); from E25-S3 in test builds only (CRY-04.15: T07 and the classical
# record CRY-05 T12 refuses). wrap.rs: the AES-256-GCM key wrap. aes-gcm is named
# here also to turn on its "zeroize", so the AES round keys inside hpke's
# contexts are wiped too.
hpke = { workspace = true, features = ["x25519", "aes", "alloc", "mlkem", "chacha"] }
# E25-S2 (CRY-05.15): hpke's `mlkem` and `chacha` above give kem::XWing
# (MLKEM768-X25519, KEM id 0x647a, through x-wing and ml-kem) and
# ChaCha20-Poly1305 for the hybrid suite [0x647a, 1, 3] (pq.rs). ML-DSA-65
# for the composite signature: `rand_core` for hedged signing with
# larsal-crypto's random source, `zeroize` so its key types wipe on drop.
ml-dsa = { workspace = true, features = ["rand_core", "zeroize"] }
aes-gcm = { workspace = true, features = ["aes", "zeroize"] }
# E7-S1 (INT-01.49): bridge.rs, the browser bridge channel's X25519; the
# features hpke already turns on, so the build does not change.
x25519-dalek = { workspace = true, features = ["static_secrets", "zeroize"] }

# E22-S2 / E23-S2: defaults off; retain explicit key-state wiping.
scrypt.workspace = true
chacha20poly1305 = { workspace = true, features = ["zeroize"] }
bech32.workspace = true
aes-siv = { workspace = true, features = ["zeroize"] }
aes-kw = { workspace = true, features = ["zeroize"] }
cmac = { workspace = true, features = ["zeroize"] }
unicode-normalization.workspace = true

[features]
# E16-S5: a software P-256 key that signs (sign.rs `P256TestKey`), the test
# client's device key in larsal-server's tests. Only test builds turn it on,
# through a dev-dependency; a normal build has no P-256 signer for sync.
test-p256-key = []
# E25-S3 (CRY-05 T29): pq.rs `kem_shared_secret`, the X-Wing shared secret of a
# wrap, so the sync suite's zero-knowledge search can look for it. Only test
# builds turn it on, through larsal-ffi's dev-dependency; a normal build has
# no way to a KEM shared secret.
test-kem-secret = []
# E24-S2 (Checker 1 C1-F4): random.rs `test_os_source_down`, a seam that makes
# the OS source fail for New SSH Key's generator. Only larsal-ffi's
# dev-dependency turns it on; a normal build has no such seam.
test-random = []

[dev-dependencies]
proptest.workspace = true
# F-070, F-170, F-190: the probe allocator of tests/ssh_wipe.rs, tests/sync_wipe.rs
# and tests/bridge_wipe.rs (test tools only).
larsal-platform = { workspace = true, features = ["test-memory"] }
# E25-S2 (CRY-05.16): the ML-KEM-768 known-answer tests run on the copy hpke and
# x-wing use (pq/tests.rs); tests only.
ml-kem = { workspace = true, features = ["zeroize"] }

[lints]
workspace = true
